# What each question in the published form carries, by id. Written by hand
# from the snapshot beside it (`_data/forms/calculator.yml`) once the form was
# published; `npm run check:form` fails the build if any id here is no longer
# in the live template. Labels are free to change; ids are not.
#
# A key is what the page sends. Options map a value the page uses to the
# option id in the form. A grid maps row keys to row ids and column *values*
# (what the model reads: hours, people, a share) to column ids.

fields:
  # ── Accounts & Storage ────────────────────────────────────────────────────
  mau: { id: OKIJzE }                      # Number of Monthly Active Users
  posts_per_user: { id: mSsJdP }           # Average posts or messages per month per user
  mb: { id: BwgQbZ }                       # Average storage per user (MB)

  # ── Staffing Costs ────────────────────────────────────────────────────────
  # Content review & moderation (head count): rows in-house / vendor seats,
  # columns are bands; the value is the band's midpoint.
  moderation:
    id: koRqow
    rows: { inhouse: 8PeqEx, vendor: nC71IR }
    columns: { "0": 8VtN8o, "5": 3Lgs1E, "50": CiCpnA, "500": v1ZTFU, "2000": 9ujHYA }
  # Software engineering (hours per week): rows are the cost areas; the value
  # is hours a week at the band's midpoint.
  engineering:
    id: fIVb03
    rows: { accounts: r4poWN, content: kRSm6z, infra: VAbmsc, legal: Bf2zG1 }
    columns: { "0": CW1BOL, "5": ark9hI, "25": Zp1lRi, "60": 82oxXo }
  legal_usd: { id: 05IgYp }                # Legal, privacy and compliance, USD per year

  # ── Payment Gateway ───────────────────────────────────────────────────────
  rails:
    id: 88UlKt
    options: { p2p: Q9rNXl, apple: sO56FE, google: pQBEbj, processor: vp18O4, reseller: mlhsBh }
  rev: { id: YdT6dC }                      # gross monthly in-app revenue, USD
  balances:
    id: 5VlKkm
    options: { "yes": eh05HT }             # holds user balances, credits or wallets

  # ── Availability & Growth ─────────────────────────────────────────────────
  distribution:
    id: 4F44bp
    options: { apple: dZHVfs, google: rq31GJ, web: QwlqB5 }
  jur:
    id: ePAdxW
    options: { eu: 3YfIJX, uk: pq8Wgs, us: gVmoP3, other: 1667Tr }
  # User growth over the next year, as a share: Flat / Steady / Fast / Doubling.
  growth:
    id: Oa0uzB
    options: { "0": Y5qAsA, "0.25": AyAW8J, "0.5": IxM6Xo, "1": ftLXDP }

  # ── Non Custody ───────────────────────────────────────────────────────────
  # "Our app already uses Nostr": Never / Somewhat / Always as 0, 0.5 and 1.
  nostr:
    id: 8H7dN3
    rows:
      keys: 8BpUSF            # User accounts are private keys
      raw_keys: RNrSLI        # App handles raw private keys (the inverse)
      signed_events: q1SIRT   # User data stored as signed events
      event_storage: 2SxIwT   # User choice for event storage
      media_storage: k7iBf9   # User choice for media storage
      labels: fJVpOZ          # Content tags and labels as signed events
      feeds: 0L5VFM           # User configurable feeds & algos
      algos: bVCrfA           # User choice for algo processing
      p2p: AdjiqB             # Peer to peer in-app payments
      nips: CK5CCl            # NIP standards published publicly (read, not priced)
    columns: { "0": CzJFM6, "0.5": WUHYyN, "1": jF8mep }

  # ── Calculated Results (filled by the page) ───────────────────────────────
  result_custodial: { id: qPZrNj }
  result_noncustodial: { id: C93CmL }
  link: { id: iHHHuZ }
  overrides: { id: LxmN8x }
  version: { id: OHi8fq }
  test: { id: XU5x6e }                     # set only from ?test= in the URL

  # ── Save & Share (the contact details) ────────────────────────────────────
  app_name: { id: t3pia5 }                 # App Name
  company: { id: 5UFMyH }                  # Company Name
  contact_name: { id: BBZoy9 }             # Contact Name
  email: { id: PgP68U }                    # Contact Email
