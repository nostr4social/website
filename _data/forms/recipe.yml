# The calculator's form as it is built by hand in formstr.app: the title,
# the sections in order, and each question's label, type and options. The
# page never reads this file. It reads the snapshot of the published event
# (_data/forms/calculator.yml) and the id map beside it (_data/forms/map.yml),
# so edit the form in the builder to match this recipe, then
# `npm run snapshot:form` and `npm run check:form`, and give any new question
# its id in the map. Labels are free to change; ids are what the build checks.
#
# Published 2026-10-26 for assumptions version 3 (30 questions): the title,
# the two payment questions on in-app volume, and the three hidden Results
# questions. One item is still pending in the builder, marked below.

title: "Nostr4 : Non-Custodial Savings Calculator"
description: calculator available online at https://nostr4.social/calculator

sections:
  - title: Nostr
    questions:
      - key: nostr_now
        label: Does your app already use Nostr?
        type: single choice
        options: [Not at all, Somewhat, Fully Integrated]
      - key: nostr
        label: "Your app uses Nostr for the following:"
        type: grid
        rows:
          - User accounts are private keys
          - App handles raw private keys
          - User data stored as signed events
          - User choice for event storage
          - User choice for media storage
          - Content tags and labels as signed events
          - User configurable feeds & algos
          - User choice for algo processing
          - Peer to peer in app payments
          - NIP standards published publicly
        columns: [Never, Somewhat, Always]

  - title: Users
    questions:
      - key: mau
        label: How many Monthly Active Users (MAU)
        type: number
        required: true
      - key: growth
        label: How fast is your user base growing? (estimated for the next year)
        type: single choice
        options: ["Flat or shrinking", "Steady, around 25%", "Fast, around 50%", "Doubling or more"]

  - title: Content
    questions:
      - key: kind
        label: What type best describes your app?
        type: single choice
        options: [Messaging, Media feed, Community, Marketplace]
      - key: posts_per_user
        label: Average number of Posts or Messages per month per user
        type: number
      - key: mb
        label: Average storage per user (in MB)
        type: number

  - title: Moderation
    questions:
      - key: mod_who
        label: Who moderates users and content?
        type: single choice
        # Unanswered and Nobody are read differently by the page: unanswered
        # bills the benchmark, Nobody bills nothing. No new option is needed.
        options: [Nobody, Our team, A vendor]
      - key: mod_heads
        label: Number of moderators (in house or vendor seats)
        type: single choice
        options: [one, up to 3, up to 15, up to 140, up to 500, more]

  - title: Team
    questions:
      - key: team
        label: How many people on your team?
        type: single choice
        options: [only one, up to 10, up to 50, more]
      - key: engineering
        label: "How many developer hours per week spent on the following:"
        type: grid
        rows: [Managing user accounts, Managing user content, Managing Infrastructure, Legal and compliance]
        columns: ["0", "1 - 10", "11 - 40", "> 40"]
      - key: legal_usd
        label: What is your approximate yearly spend on legal, privacy and compliance (in USD)
        type: number

  - title: Payments
    questions:
      # Gross monthly volume of the in-app payments the app facilitates, not its own revenue.
      - key: rev
        label: What is the approximate monthly volume of in-app payments (purchases, subscriptions, and p2p tips or sales in USD)?
        type: number
      - key: rails
        label: Which rails carry those payments today?
        type: checkboxes
        # Peer to Peer stays, for apps already paid in sats.
        options:
          - Peer to Peer (bitcoin, lightning, or other crypto)
          - Apple in-app purchase
          - Google Play billing
          - Third party processor (Stripe, PayPal, Adyen)
          - Third party reseller (Paddle, Lemon Squeezy, FastSpring)
      - key: balances
        label: Do you hold user balances, credits or wallets?
        type: checkboxes
        options: ["Yes"]

  - title: Reach
    questions:
      - key: jur
        label: What regions hold primary jurisdiction?
        type: checkboxes
        required: true
        options: [EU, UK, US, Other]
      - key: distribution
        label: How is your app distributed?
        type: checkboxes
        options: [Apple App Store, Google Play, Web or direct]

  # The section whose title names the Save & Share button; the page draws
  # its questions in the modal, with the consent line under the email.
  - title: Send & Share
    # Pending in the builder: the published description still reads the
    # earlier text ("Send your calculated results to us as a Nostr event…").
    description: >-
      Send us your results and we will follow up to schedule a free consult.
      If you already use Nostr, sign with your key to update or revisit these
      results later.
    questions:
      - key: email
        label: Contact Email
        type: short text
      - key: contact_name
        label: Contact Name
        type: short text
      - key: company
        label: Company Name
        type: short text
      - key: app_name
        label: App Name
        type: short text

  # Filled by the page, never drawn, except the test marker, which is the
  # small checkbox beside the button in the modal.
  - title: Results
    questions:
      - key: test
        label: test submission. do not record.
        type: checkboxes
        options: [test]
      - key: version
        label: Assumptions version
        type: short text
      - key: overrides
        label: Assumption overrides (JSON)
        type: paragraph
      - key: link
        label: Results link
        type: short text
      - key: result_noncustodial
        label: Annual non-custodial cost (USD, typical)
        type: number
      - key: result_custodial
        label: Annual custodial cost (USD, typical)
        type: number
      - key: fees_saved
        label: Fees saved (at scale)
        type: short text
      - key: payback_month
        label: Payback month
        type: short text
      - key: integ_weeks
        label: Integration weeks (typical)
        type: short text
