# Who TrustR serves. The provider sits above the three kinds of customer,
# because everything below it is someone choosing to use it.
hub:
  icon: cloud
  tone: rust
  title: TrustR.ing
  note: >-
    On demand processing of TSM requests for recommendation and
    discovery.
items:
  - icon: phone
    title: Client Apps
    note: >-
      Consumers of TSM processing for users without their own. Authors of custom
      TSM requests.
  - icon: face
    title: Power Users
    note: >-
      Consumers of bespoke TSM processing for apps and services supporting BYO
      processor.
  - icon: storage
    title: Relay Services
    note: Resellers of white labeled TSM processing as a value add for personal relay customers.
