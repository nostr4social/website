    # ── machine configuration ────────────────────────────────────────────────
    config:
      client:
        name: nostr4.social
      contact_href: /contact/
      # The name in nostr.json that a lead is sent to.
      lead_recipient: hello
      # NIP-13 proof of work, in leading zero bits: on the kind 1069 response
      # from a one-time key, on the gift wrap of a lead message from one, and
      # from a signed-in visitor (who skips both). Each bit doubles the work.
      pow:
        response: 20
        anonymous: 18
        signed: 0
      limits:
        min_seconds: 3
        rate:
          window: 600000
          max: 3

  - type: callout
    band: raised
    head:
      title: Nostr at Scale
      lede: >-
        Nostr4 exists to grow the network of independent social apps. We are
        actively developing the infrastructure and standards, and the
        onboarding services, that let an app release custody without losing
        its users. We expect non-custody to be fully supported and profitable
        on Nostr within three years. That is the tipping point from which
        Nostr scales.
    actions:
      - label: Read More about Nostr
        href: /nostr/
      - label: Book a Free Consult
        href: /contact/?subject=Free+consult
        style: primary
