# The calculator: the /nostr/ argument with the reader's own numbers in it.
# Six cost lines, two columns, a range on every figure, and every assumption
# on the page where it can be changed. The form is a Nostr form: a submission
# is a kind 1069 event encrypted to the form's key, and the page says so.
#
# Rules for this page:
# - Overclaiming is the risk. Typical is the headline; the range is the claim.
# - The non-custodial column is never zero where an obligation remains.
# - Nothing about the person is ever in the results link.

meta:
  title: Non-Custodial Savings Calculator
  description: >-
    This calculator exposes the misunderstood cost center of holding custody, and the savings to be had by releasing custody, of user accounts and data in social apps.

sections:
  - type: hero
    glow: left
    tight: true
    head:
      eyebrow: Nostr Integration - Justified
      eyebrow_tone: gold
      title: Non-Custodial Savings Calculator
      lede: >-
        User custody is a cost center that is often overlooked, and for good reason. Most businesses have no choice but to hold custody of user accounts and their content. Selling access to these is one means of recouping the cost, but what if non-custody itself was actually ... a more profitable option? 
        This calculator exposes the misunderstood cost center of holding custody, and the savings to be had by releasing custody, of user accounts and data in social apps.

  - type: calculator
    id: calculator

    # ── the form ─────────────────────────────────────────────────────────────
    # Every word of the form comes from the published form event (snapshot in
    # _data/forms/calculator.yml): section titles, questions, options, grid
    # rows and columns. Nothing here is form copy. What is here is how a
    # question is drawn: which number questions are sliders and over which
    # stops, and the page chrome around the form.
    form:
      # Number questions drawn as stepped sliders: the stops the slider
      # offers and how each stop is named. The key is the question's key in
      # _data/forms/map.yml. A number question without stops is a text input.
      sliders:
        mau:
          "1000": 1k
          "2000": 2k
          "5000": 5k
          "10000": 10k
          "20000": 20k
          "50000": 50k
          "100000": 100k
          "200000": 200k
          "500000": 500k
          "1000000": 1M
          "2000000": 2M
          "5000000": 5M
          "10000000": 10M
        posts_per_user:
          "1": "1"
          "2": "2"
          "5": "5"
          "10": "10"
          "20": "20"
          "50": "50"
          "100": "100"
          "200": "200"
          "500": "500"
          "1000": "1000"
        mb:
          "0": "0"
          "5": 5 MB
          "10": 10 MB
          "20": 20 MB
          "50": 50 MB
          "100": 100 MB
          "200": 200 MB
          "500": 500 MB
          "1000": 1 GB
          "2000": 2 GB
          "5000": 5 GB
        legal_usd:
          "0": "0"
          "1000": $1k
          "2000": $2k
          "5000": $5k
          "10000": $10k
          "20000": $20k
          "50000": $50k
          "100000": $100k
          "200000": $200k
          "500000": $500k
          "1000000": $1M
        rev:
          "0": "0"
          "1000": $1k
          "2000": $2k
          "5000": $5k
          "10000": $10k
          "20000": $20k
          "50000": $50k
          "100000": $100k
          "200000": $200k
          "500000": $500k
          "1000000": $1M
          "2000000": $2M
          "5000000": $5M
      # Grid columns are bands; the band's value is in the map. A column's
      # name comes from the form; nothing to add here.
      honeypot_label: Leave this field empty
      submit:
        label: Calculate
      sign:
        guest_note: >-
          Saved with a one-time key, generated in this browser and discarded
          after use.
        bunker: Sign with Remote Bunker
        extension: Sign with Browser Extension
        switch: Switch

    # ── the tabs ─────────────────────────────────────────────────────────────
    tabs:
      cost: Results
      app: App Details
      assumptions: Assumptions
      # What the cost tab shows before anything has been calculated.
      empty: Fill in App Info and press Calculate.

    # ── the Save & Share modal ───────────────────────────────────────────────
    # Its title, description and questions come from the form's own section;
    # this is the chrome around them. Brief on purpose.
    modal:
      consent: You may email me about these results.
      save: Send Results to Nostr4
      copy: Copy URL for Sharing
      close: Close
      switch: Switch
      # The dialog Save to Nostr opens: how the response is signed.
      sign:
        title: Sign the response
        extension: With my browser extension
        extension_note: Alby, nos2x, Amber. You can update or delete the response later from any Nostr client.
        bunker: With my remote signer
        bunker_note: nsec.app or any bunker. Same as above, approved on your signer.
        session: Without a key
        session_note: A disposable key made for this tab. Close the tab and it is gone; nothing can be updated or deleted later.
        cancel: Cancel

    # ── the results ──────────────────────────────────────────────────────────
    results:
      title: Estimated Savings
      # The pictures, in order, full width. The ids are the chart module's;
      # it also draws chart-cumulative-savings (cumulative saving by year
      # with the low case as a floor) if listed here.
      charts:
        - id: chart-custodial-cost-vs-nostr
          title: Projected Nostr Integration
          legend:
            custodial: Cost of Custody
            nostr: Cost of Nostr
          caption: >-
            A year's cost, typical case, as the app grows. The cost of Nostr
            starts where you are today and falls as custody leaves. The
            shaded gap is five years of saving. Integration cost is not
            estimated here; it depends on your app, and we scope it on a
            call.
      # The three facts under the chart.
      stats:
        custodial_per_mau:
          label: Custodial Cost per User/Year
        nostr_per_mau:
          label: Nostr Cost per User/Year
        average:
          label: Average Savings per Year
      # Measures down, years across; the script fills the year heads and the cells.
      years:
        summary: Year by year
        columns:
          year: Year
        rows:
          users: Active users
          custodial: Cost of Custody
          path: Cost of Nostr
          realised: Saved
          cumulative: Cumulative Savings
      # Where the saving comes from: the six lines as shares of the average
      # saving a year, which the foot row and the tinted fact chip both name.
      table:
        title: Non-Custody Savings in Detail
      columns:
        line: Cost line
        saving: Saved per year
        share: Percent of Cost
        remains: What remains
      lines:
        - id: accounts
          icon: lock-closed
          title: Accounts & personal data
          remains: >-
            An age signal from the store or wallet where the law still asks
            for one, and support for users who manage their own keys.
        - id: graph
          icon: hub
          title: Social graph & feeds
          remains: >-
            A client that assembles feeds from relays, and a ranking service
            you run or choose.
        - id: storage
          icon: storage
          title: Compute & storage
          remains: >-
            A relay or two for reliability, media you choose to host, and a
            thin cache.
        - id: compliance
          icon: doc
          title: Compliance & liability
          remains: >-
            Part of the DSA and Online Safety Act programs, for whatever you
            still host, and a privacy program for whatever you still retain.
        - id: moderation
          icon: gavel
          title: Moderation
          remains: >-
            Illegal-content handling for any relay you run, app-store filter
            and report rules, and a label or web-of-trust provider. Review and
            ranking move to the network.
        - id: payments
          icon: card
          title: Payments
          remains: >-
            Store rules still apply to what is sold inside the app. Your own
            revenue can move to peer-to-peer rails at about 1% instead of
            3% plus 15 to 30%.
      # Quiet notes under a line's name, where one applies.
      already: Already on Nostr
      partly: Partly on Nostr
      no_payments: No in-app payments
      actions:
        edit:
          label: Customize App Details

    # ── the assumptions panel ────────────────────────────────────────────────
    assumptions:
      title: Our Assumptions
      intro: >-
        Typical is what the results show. Low and high bound the range beside
        every figure, and low always means the smaller cost. Change a typical
        value, press Recalculate, and the change travels in the results link.
      recalculate: Recalculate
      columns:
        what: What
        typical: Typical
        low: Low
        high: High
        unit: Unit
        confidence: Confidence
        source: Source
      confidence:
        high: sourced
        medium: derived
        low: weak
        unsourced: unsourced
      lines:
        shared: Used by more than one line
        accounts: Accounts & personal data
        graph: Social graph & feeds
        storage: Compute & storage
        compliance: Compliance & liability
        moderation: Moderation
        payments: Payments
      reset: Reset to typical
      files_label: The files behind this
      files:
        - label: assumptions.v1.json
          href: /calculator/assumptions.v1.json
        - label: assumptions.v1.md
          href: /calculator/assumptions.v1.md
      noscript: >-
        The calculator needs JavaScript to run. The assumptions it uses are
        listed here, with sources; for an estimate by hand, contact us.

    # ── strings the script needs ─────────────────────────────────────────────
    strings:
      range: "Range {low} to {high}"
      range_short: "{low} to {high}"
      per_mau_pair: "{custodial} today, {noncustodial} on Nostr"
      # In place of a zero, where a line could save but does not yet.
      nudges:
        p2p: "Adds about {amount} a year with a peer-to-peer rail."
      # "How this is calculated": the dialog a part opens. {a.key} is an
      # assumption's value in use, {i.key} an input, {p.key} the part's own
      # number, {d.key} a derived one. Each formula has a today and a Nostr line.
      how:
        title: How this is calculated
        rests_on: Rests on
        adjust: Adjust Assumptions
        changed: changed
        meta: "{low} to {high} · {confidence}"
        averaged: "Averaged over the five projected years, with growth and the ramp: {p.custodial} of custody becomes {p.noncustodial} on Nostr. That is the figure in the savings list."
        showing: "Showing the {n} assumptions behind {part}."
        show_all: Show all
        confidence:
          high: sourced
          medium: derived
          low: weak source
          unsourced: unsourced
        programs:
          gdpr: GDPR program
          osa: UK Online Safety Act
          dsa: Digital Services Act
          us_small: US privacy program, below the CCPA threshold
          us_large: US privacy program, at or above the CCPA threshold
          none: no program applies in the regions given
        formulas:
          auth:
            today: "{i.mau} users × {a.auth_per_mau_month} a month × 12 = {p.custodial}"
            nostr: "Nothing. Keys replace accounts, so there is no authentication service to pay for."
          resets:
            today: "{i.mau} users × {a.reset_rate_per_mau_year} resets a year × {a.reset_cost} a reset = {p.custodial}"
            nostr: "Nothing. There are no passwords to reset."
          verify:
            today: "{i.mau} users × {p.rate} checked a year × {a.verify_price} a check = {p.custodial}"
            nostr: "{a.verify_remains_share} of checks remain, where the law still reaches the client: {p.noncustodial}"
          engineering_accounts:
            today: "{p.hours} hours a week × {d.weeks} weeks × {p.hourly} an hour, fully loaded = {p.custodial}"
            nostr: "Nothing. The accounts this time managed are gone."
          key_support:
            today: "Nothing today."
            nostr: "{i.mau} users × {a.key_support_per_mau_year} a year for onboarding, recovery guidance and signer support = {p.noncustodial}"
          database:
            today: "{p.gb} GB ({i.mau} users × {a.db_mb_per_mau} MB, plus {p.posts} posts a month kept {d.retention} months at {a.db_kb_per_post} KB) × {a.db_gb_month} a GB-month × 12 = {p.custodial}"
            nostr: "Nothing. The graph lives on relays."
          feed_compute:
            today: "{i.mau} users × {a.compute_per_mau_year} a year × {a.feed_compute_share} of it on feeds = {p.custodial}"
            nostr: "Nothing. Feeds assemble on the client."
          engineering_graph:
            today: "{p.hours} hours a week × {d.weeks} weeks × {p.hourly} an hour, fully loaded = {p.custodial}"
            nostr: "{a.graph_eng_remains_share} remains, for the client's own feed logic: {p.noncustodial}"
          ranking:
            today: "Nothing today."
            nostr: "{i.mau} users × {a.ranking_fee_per_mau_year} a year for a ranking or discovery provider = {p.noncustodial}"
          blob:
            today: "{i.mau} users × {i.mb} MB = {p.gb} GB × {a.blob_gb_month} a GB-month × 12 = {p.custodial}"
            nostr: "{a.media_sponsor_share} remains, for media you still choose to host: {p.noncustodial}"
          egress:
            today: "{i.mau} users × {a.egress_gb_per_mau_month} GB a month × 12 = {p.gb} GB × {a.egress_gb} a GB = {p.custodial}"
            nostr: "{a.media_sponsor_share} remains, for the media you still host: {p.noncustodial}"
          serving:
            today: "{i.mau} users × {a.compute_per_mau_year} a year × {p.share} of it on serving = {p.custodial}"
            nostr: "{i.mau} users × {a.cache_per_mau_year} a year for a thin cache = {p.noncustodial}"
          engineering_storage:
            today: "{p.hours} hours a week × {d.weeks} weeks × {p.hourly} an hour, fully loaded = {p.custodial}"
            nostr: "Nothing. There is no fleet of your own to run."
          relay:
            today: "Nothing today."
            nostr: "A relay or two of your own: {a.relay_cost_year} a year."
          privacy_programs:
            today: "{d.programs} = {p.custodial}"
            nostr: "{a.content_law_remains_share} of the content-law programs remain, for whatever you still host, and {a.privacy_remains_share} of the privacy programs, for whatever you still retain: {p.noncustodial}"
          privacy_programs_reported:
            today: "Your reported legal, privacy and compliance spend, {p.custodial}, replaces the estimate."
            nostr: "Of that, the content-law part ({p.content_law}) remains at {a.content_law_remains_share} and the rest at {a.privacy_remains_share}: {p.noncustodial}"
          legal_labour:
            today: "{p.hours} hours a week × {d.weeks} weeks × {p.hourly} an hour, fully loaded = {p.custodial}"
            nostr: "{a.privacy_remains_share} remains, for whatever you still retain: {p.noncustodial}"
          dsar:
            today: "{i.mau} users × {a.dsar_rate_per_mau_year} access requests a year × {a.dsar_cost} each = {p.custodial}"
            nostr: "Nothing. There is no personal data to serve requests on."
          insurance:
            today: "A small company's cyber policy: {a.cyber_insurance_year} a year."
            nostr: "{a.insurance_remains_share} remains: {p.noncustodial}"
          breach:
            today: "{a.breach_prob_year} chance a year × the lesser of {a.breach_cost_cap} and {i.mau} users × {a.breach_cost_per_user} = {p.custodial}"
            nostr: "The same chance, on the {a.retained_data_share} of personal data still held: {p.noncustodial}"
          labour_implied:
            today: "No reviewers were given, so {a.mods_per_million_mau} per million users gives {p.people} people × {p.loaded} a year, fully loaded = {p.custodial}"
            nostr: "{a.moderation_remains_share} remains, for whatever you host yourself: {p.noncustodial}"
          labour_given:
            today: "{p.inhouse} in-house × {p.loaded} a year, fully loaded, plus {p.vendor} vendor seats × {a.moderator_seat_outsourced} = {p.custodial}"
            nostr: "{a.moderation_remains_share} remains, for whatever you host yourself: {p.noncustodial}"
          appeals:
            today: "{a.appeals_share} of review labour, for appeals and escalation = {p.custodial}"
            nostr: "{a.moderation_remains_share} remains: {p.noncustodial}"
          tooling:
            today: "{i.mau} users × {a.ts_tooling_per_mau_year} a year for classifiers, queues and hash matching = {p.custodial}"
            nostr: "{a.tooling_remains_share} remains, for hash matching on what you host: {p.noncustodial}"
          labels:
            today: "Nothing today."
            nostr: "{i.mau} users × {a.label_provider_per_mau_year} a year for a label or web-of-trust provider = {p.noncustodial}"
          store_apple:
            today: "{p.revenue} a year through the App Store × {p.rate} ({d.tier}) = {p.custodial}"
            nostr: "The same. Store rules still apply to what is sold inside the app."
          store_google:
            today: "{p.revenue} a year through Google Play × {p.rate} ({d.tier}) = {p.custodial}"
            nostr: "The same. Store rules still apply to what is sold inside the app."
          processor:
            today: "{p.revenue} a year × {p.rate}, plus {p.tickets} payments × {p.fixed} = {p.custodial}"
            nostr: "{p.revenue} × {a.lightning_rate} on a peer-to-peer rail = {p.noncustodial}"
          reseller:
            today: "{p.revenue} a year × {p.rate}, plus {p.tickets} payments × {p.fixed} = {p.custodial}"
            nostr: "{p.revenue} × {a.lightning_rate} on a peer-to-peer rail = {p.noncustodial}"
          p2p:
            today: "{p.revenue} a year × {a.lightning_rate} = {p.custodial}"
            nostr: "The same: {p.noncustodial}"
          money_transmitter_holds:
            today: "Holding balances means staying out of money-transmitter rules: {a.mt_avoidance_year} a year."
            nostr: "{a.mt_remains_share} remains: {p.noncustodial}"
          money_transmitter:
            today: "Nothing. No balances are held."
            nostr: "Nothing."
      # Whose estimate the tab shows: the illustrative app's, or the visitor's.
      whose:
        illustrative: "A typical estimate for an app with {mau} active users."
        yours: "Your estimate, for an app with {mau} active users."
        link: Customize App Details
      chart:
        today: Today
        year: "Year {n}"
        marker: "{amount} by year {n}"
        floor: "at least {amount}"
        aria: "Cumulative saving rises to {end} by year five; the low case gives at least {low}."
        tip:
          users: "{n} active users"
          custodial: "Custody that year: {amount}"
          noncustodial: "On Nostr: {amount}"
          realised: "Saved that year: {amount}"
          cumulative: "Saved so far: {amount}"
          path: "On the way to Nostr: {amount}"
          gap: "Saved that year: {amount}"
        versus:
          band_sub: savings over five years
          runway: Runway
          start: Start
          users: Users
          tip_custody: "Cost of Custody: {amount}"
          tip_nostr: "Cost of Nostr: {amount}"
          tip_cumulative: "Cumulative Savings: {amount}"
          aria: "Custody costs {custodial} a year by year five against {noncustodial} on Nostr, a gap of {saving}; the area between them is {total}."
      version: "Assumptions version {version}"
      contact_subject: Cost of custody estimate
      # What the Save & Share modal says at runtime.
      modal:
        needed: "Still needed: {list}"
        consent_name: your consent to email
        signed: Signed with your key. You can update or delete this later from any Nostr client.
        saved: "Sent · {ok} of {total} relays · event {id}"
      changed: changed
      details:
        show: Show the Savings
        hide: Hide the Savings
        today: Cost of Custody
        on_nostr: Cost of Nostr
        tier_small: small-business tier
        tier_standard: standard tier
        us_small: below the CCPA threshold
        us_large: at or above the CCPA threshold
        people: "{n} people"
        people_implied: "about {n} people, from benchmarks"
        rate: "{rate} applied"
        checked: "{rate} of users checked a year"
        gb: "{gb} GB"
        defaulted: default hours
        reported: as reported
        holds: holds balances
      parts:
        auth: Authentication service
        resets: Password resets
        verify: Identity and age checks
        engineering: Engineering time
        key_support: Supporting self-managed keys
        database: Graph and metadata database
        feed_compute: Feed and recommendation compute
        ranking: Ranking provider
        blob: Media storage
        egress: Egress
        serving: Serving compute
        relay: A relay of your own
        privacy_programs: Compliance programs
        legal_labour: Engineering time on compliance
        dsar: Access requests
        insurance: Cyber insurance
        breach: Expected breach loss
        labour: Review labour
        appeals: Appeals and escalation
        tooling: Moderation tooling
        labels: Label or web-of-trust provider
        store_apple: Apple App Store commission
        store_google: Google Play commission
        processor: Payment processing
        reseller: Merchant of record
        p2p: Peer-to-peer rail
        money_transmitter: Money-transmitter avoidance
      status:
        saving: Saving your inputs as a Nostr form response
        mining: "Proving work on the response · {hashes} hashes"
        saved: "Saved as a Nostr form response · {ok} of {total} relays"
        failed: Could not reach a relay to save your inputs. Your results are unaffected.
        shared: Opened from a results link. Nothing was submitted.
        opening: Opening the saved response...
        opened: "Opened a response sent {when}, {how}."
        opened_responder: with the key that sent it
        opened_holder: as its recipient
        opened_plain: which was not encrypted
      # The message hello receives when a submission carries contact details.
      compose:
        header: "via nostr4.social/calculator:"
        subject: Cost of custody lead
        results: "Custodial {custodial} a year; on Nostr {noncustodial}."
        five_year: "Saved over five years: {five_year}, at least {floor}."
        link: "Results: {link}"
        open: "Open in the calculator: {link}"
      errors:
        required: "{field} is required."
        invalid: "{field} has a value this page does not recognise."
        not_a_number: "{field} must be a number."
        not_an_integer: "{field} must be a whole number."
        too_small: "{field} is too small."
        too_large: "{field} is larger than this model handles."
        too_fast: That was quick. Give it a moment and send again.
        restore_missing: That response was not found on the relays.
        restore_locked: >-
          To open a sent response, sign in with the key that sent it, or as
          Nostr4.
        rate_limited: That is three sends in ten minutes. Give it a rest.
        unknown: Something went wrong. Reload and try again.
      money:
        year: per year
        per_mau: per active user per year

    # ── machine configuration ────────────────────────────────────────────────
    config:
      client:
        name: nostr4.social
      contact_href: /contact/
      # The name in nostr.json that a lead is sent to.
      lead_recipient: hello
      # NIP-13 proof of work, in leading zero bits: on the kind 1069 response
      # from a one-time key, on the gift wrap of a lead message from one, and
      # from a signed-in visitor (who skips both). Each bit doubles the work.
      pow:
        response: 20
        anonymous: 18
        signed: 0
      limits:
        min_seconds: 3
        rate:
          window: 600000
          max: 3

  - type: callout
    band: raised
    head:
      title: This is the argument, with your numbers in it.
      lede: >-
        The six lines come from the business case for Nostr. Read why each
        one exists, and what the protocol hands back, then tell us where our
        estimate is wrong.
    actions:
      - label: Read Nostr 4 Social Apps
        href: /nostr/
      - label: Book a Free Consult
        href: /contact/?subject=Free+consult
        style: primary
