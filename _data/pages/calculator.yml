# The calculator: the /nostr/ argument with the reader's own numbers in it.
# Six cost lines, two columns, a range on every figure, and every assumption
# on the page where it can be changed. The form is a Nostr form: a submission
# is a kind 1069 event encrypted to the form's key, and the page says so.
#
# Rules for this page:
# - Overclaiming is the risk. Typical is the headline; the range is the claim.
# - The non-custodial column is never zero where an obligation remains.
# - Nothing about the person is ever in the results link.

meta:
  title: Non-Custodial Savings Calculator
  description: >-
    This calculator exposes the misunderstood cost center of holding custody, and the savings to be had by releasing custody, of user accounts and data in social apps.

sections:
  - type: hero
    glow: left
    tight: true
    head:
      eyebrow: Nostr Integration - Justified
      eyebrow_tone: gold
      title: Non-Custodial Savings Calculator
      lede: >-
        User custody is a cost center that is often overlooked, and for good reason. Most businesses have no choice but to control user accounts and their content. Selling access to these is one means of recouping the cost, but what if non-custody itself was simply ... a profitable option? 
        This calculator exposes the misunderstood cost center of holding custody, and the savings to be had by releasing custody, of user accounts and data in social apps.

  - type: calculator
    id: calculator

    # ── the form ─────────────────────────────────────────────────────────────
    # Every word of the form comes from the published form event (snapshot in
    # _data/forms/calculator.yml): section titles, questions, options, grid
    # rows and columns. Nothing here is form copy. What is here is how a
    # question is drawn: which number questions are sliders and over which
    # stops, and the page chrome around the form.
    form:
      # Number questions drawn as stepped sliders: the stops the slider
      # offers and how each stop is named. The key is the question's key in
      # _data/forms/map.yml. A number question without stops is a text input.
      sliders:
        mau:
          "1000": 1k
          "2000": 2k
          "5000": 5k
          "10000": 10k
          "20000": 20k
          "50000": 50k
          "100000": 100k
          "200000": 200k
          "500000": 500k
          "1000000": 1M
          "2000000": 2M
          "5000000": 5M
          "10000000": 10M
        posts_per_user:
          "1": "1"
          "2": "2"
          "5": "5"
          "10": "10"
          "20": "20"
          "50": "50"
          "100": "100"
          "200": "200"
          "500": "500"
          "1000": "1000"
        mb:
          "0": "0"
          "5": 5 MB
          "10": 10 MB
          "20": 20 MB
          "50": 50 MB
          "100": 100 MB
          "200": 200 MB
          "500": 500 MB
          "1000": 1 GB
          "2000": 2 GB
          "5000": 5 GB
        legal_usd:
          "0": "0"
          "1000": $1k
          "2000": $2k
          "5000": $5k
          "10000": $10k
          "20000": $20k
          "50000": $50k
          "100000": $100k
          "200000": $200k
          "500000": $500k
          "1000000": $1M
        rev:
          "0": "0"
          "1000": $1k
          "2000": $2k
          "5000": $5k
          "10000": $10k
          "20000": $20k
          "50000": $50k
          "100000": $100k
          "200000": $200k
          "500000": $500k
          "1000000": $1M
          "2000000": $2M
          "5000000": $5M
      # Grid columns are bands; the band's value is in the map. A column's
      # name comes from the form; nothing to add here.
      honeypot_label: Leave this field empty
      submit:
        label: Calculate
      sign:
        guest_note: >-
          Saved with a one-time key, generated in this browser and discarded
          after use.
        bunker: Sign with Remote Bunker
        extension: Sign with Browser Extension
        switch: Switch

    # ── the tabs ─────────────────────────────────────────────────────────────
    tabs:
      cost: Results
      app: App Input
      assumptions: Other Input
      # What the cost tab shows before anything has been calculated.
      empty: Fill in App Info and press Calculate.

    # ── the Save & Share modal ───────────────────────────────────────────────
    # Its title, description and questions come from the form's own section;
    # this is the chrome around them. Brief on purpose.
    modal:
      consent: You may email me about these results.
      save: Send Results to Nostr4
      copy: Copy URL for Sharing
      close: Close
      switch: Switch
      # The dialog Save to Nostr opens: how the response is signed.
      sign:
        title: Sign the response
        extension: With my browser extension
        extension_note: Alby, nos2x, Amber. You can update or delete the response later from any Nostr client.
        bunker: With my remote signer
        bunker_note: nsec.app or any bunker. Same as above, approved on your signer.
        session: Without a key
        session_note: A disposable key made for this tab. Close the tab and it is gone; nothing can be updated or deleted later.
        cancel: Cancel

    # ── the results ──────────────────────────────────────────────────────────
    results:
      title: Calculated Savings
      # The pictures, in order, full width. The ids are the chart module's;
      # it also draws chart-cumulative-savings (cumulative saving by year
      # with the low case as a floor) if listed here.
      charts:
        - id: chart-custodial-cost-vs-nostr
          title: Projected Nostr Integration
          legend:
            custodial: Cost of Custody
            nostr: Cost of Nostr
          caption: >-
            A year's cost, typical case, as the app grows. The cost of Nostr
            starts where you are today and falls as custody leaves. The
            shaded gap is five years of saving. Integration cost is not
            estimated here; it depends on your app, and we scope it on a
            call.
      # The three facts under the chart.
      stats:
        custodial_per_mau:
          label: Custodial Cost per User/Year
        nostr_per_mau:
          label: Nostr Cost per User/Year
        average:
          label: Average Savings per Year
      # Measures down, years across; the script fills the year heads and the cells.
      years:
        summary: Year by year
        columns:
          year: Year
        rows:
          users: Active users
          custodial: Cost of Custody
          path: Cost of Nostr
          realised: Saved
          cumulative: Cumulative Savings
      legend:
        custodial: Custodial today
        noncustodial: On Nostr
      columns:
        line: Cost line
        custodial: Custodial today
        noncustodial: On Nostr
        bars: Compared
        remains: What remains
      lines:
        - id: accounts
          icon: lock-closed
          title: Accounts & personal data
          remains: >-
            Age checks where the law demands them, and support for users who
            manage their own keys.
        - id: graph
          icon: hub
          title: Social graph & feeds
          remains: >-
            A client that assembles feeds from relays, and a ranking service
            you run or choose.
        - id: storage
          icon: storage
          title: Compute & storage
          remains: >-
            A relay or two for reliability, media you choose to host, and a
            thin cache.
        - id: compliance
          icon: doc
          title: Compliance & liability
          remains: >-
            Platform-content duties under the DSA and the Online Safety Act
            stay, and a privacy program for whatever you still retain.
        - id: moderation
          icon: gavel
          title: Moderation
          remains: >-
            Illegal-content reports, app-store policy, and appeals on what your
            app itself hosts. Ranking and discovery move to web of trust.
        - id: payments
          icon: card
          title: Payments
          remains: >-
            Store rules still apply to what is sold inside the app. Your own
            revenue can move to peer-to-peer rails at about 1% instead of
            3% plus 15 to 30%.
      already: Already on Nostr
      partly: Partly on Nostr
      implied: Benchmark-implied; nobody was given
      no_payments: No in-app payments
      actions:
        contact:
          label: Sanity-check this number with us
        edit:
          label: Edit inputs

    # ── the assumptions panel ────────────────────────────────────────────────
    assumptions:
      title: Our Assumptions
      intro: >-
        Typical is what the results show. Low and high bound the range beside
        every figure, and low always means the smaller cost. Change a typical
        value, press Recalculate, and the change travels in the results link.
      recalculate: Recalculate
      columns:
        what: What
        typical: Typical
        low: Low
        high: High
        unit: Unit
        confidence: Confidence
        source: Source
      confidence:
        high: sourced
        medium: derived
        low: weak
        unsourced: unsourced
      lines:
        shared: Used by more than one line
        accounts: Accounts & personal data
        graph: Social graph & feeds
        storage: Compute & storage
        compliance: Compliance & liability
        moderation: Moderation
        payments: Payments
      reset: Reset to typical
      files_label: The files behind this
      files:
        - label: assumptions.v1.json
          href: /calculator/assumptions.v1.json
        - label: assumptions.v1.md
          href: /calculator/assumptions.v1.md
      noscript: >-
        The calculator needs JavaScript to run. The assumptions it uses are
        listed here, with sources; for an estimate by hand, contact us.

    # ── strings the script needs ─────────────────────────────────────────────
    strings:
      range: "Range {low} to {high}"
      range_short: "{low} to {high}"
      per_mau_pair: "{custodial} today, {noncustodial} on Nostr"
      # Whose estimate the tab shows: the illustrative app's, or the visitor's.
      whose:
        illustrative: "A typical estimate for an app with {mau} active users."
        yours: "Your estimate, for an app with {mau} active users."
        make_yours: Make it yours
        adjust: Adjust
      chart:
        today: Today
        year: "Year {n}"
        marker: "{amount} by year {n}"
        floor: "at least {amount}"
        aria: "Cumulative saving rises to {end} by year five; the low case gives at least {low}."
        tip:
          users: "{n} active users"
          custodial: "Custody that year: {amount}"
          noncustodial: "On Nostr: {amount}"
          realised: "Saved that year: {amount}"
          cumulative: "Saved so far: {amount}"
          path: "On the way to Nostr: {amount}"
          gap: "Saved that year: {amount}"
        versus:
          band_sub: savings over five years
          runway: Runway
          start: Start
          users: Users
          tip_custody: "Cost of Custody: {amount}"
          tip_nostr: "Cost of Nostr: {amount}"
          tip_cumulative: "Cumulative Savings: {amount}"
          aria: "Custody costs {custodial} a year by year five against {noncustodial} on Nostr, a gap of {saving}; the area between them is {total}."
      version: "Assumptions version {version}"
      contact_subject: Cost of custody estimate
      # What the Save & Share modal says at runtime.
      modal:
        needed: "Still needed: {list}"
        consent_name: your consent to email
        signed: Signed with your key. You can update or delete this later from any Nostr client.
        saved: "Sent · {ok} of {total} relays · event {id}"
      changed: changed
      details:
        show: Show the parts
        hide: Hide the parts
        tier_small: small-business tier
        tier_standard: standard tier
        us_small: below the CCPA threshold
        us_large: at or above the CCPA threshold
        people: "{n} people"
        rate: "{rate} applied"
        gb: "{gb} GB"
        defaulted: default hours
        reported: as reported
        holds: holds balances
      parts:
        auth: Authentication service
        resets: Password resets
        verify: Identity and age checks
        engineering: Engineering time
        key_support: Supporting self-managed keys
        database: Graph and metadata database
        feed_compute: Feed and recommendation compute
        ranking: Ranking provider
        blob: Media storage
        egress: Egress
        serving: Serving compute
        relay: A relay of your own
        privacy_programs: Compliance programs
        legal_labour: Engineering time on compliance
        dsar: Access requests
        insurance: Cyber insurance
        breach: Expected breach loss
        labour: Review labour
        appeals: Appeals and escalation
        tooling: Moderation tooling
        store_apple: Apple App Store commission
        store_google: Google Play commission
        processor: Payment processing
        reseller: Merchant of record
        p2p: Peer-to-peer rail
        money_transmitter: Money-transmitter avoidance
      status:
        saving: Saving your inputs as a Nostr form response
        mining: "Proving work on the response · {hashes} hashes"
        saved: "Saved as a Nostr form response · {ok} of {total} relays"
        failed: Could not reach a relay to save your inputs. Your results are unaffected.
        shared: Opened from a results link. Nothing was submitted.
        opening: Opening the saved response...
        opened: "Opened a response sent {when}, {how}."
        opened_responder: with the key that sent it
        opened_holder: as its recipient
        opened_plain: which was not encrypted
      # The message hello receives when a submission carries contact details.
      compose:
        header: "via nostr4.social/calculator:"
        subject: Cost of custody lead
        results: "Custodial {custodial} a year; on Nostr {noncustodial}."
        five_year: "Saved over five years: {five_year}, at least {floor}."
        link: "Results: {link}"
        open: "Open in the calculator: {link}"
      errors:
        required: "{field} is required."
        invalid: "{field} has a value this page does not recognise."
        not_a_number: "{field} must be a number."
        not_an_integer: "{field} must be a whole number."
        too_small: "{field} is too small."
        too_large: "{field} is larger than this model handles."
        too_fast: That was quick. Give it a moment and send again.
        restore_missing: That response was not found on the relays.
        restore_locked: >-
          To open a sent response, sign in with the key that sent it, or as
          Nostr4.
        rate_limited: That is three sends in ten minutes. Give it a rest.
        unknown: Something went wrong. Reload and try again.
      money:
        year: per year
        per_mau: per active user per year

    # ── machine configuration ────────────────────────────────────────────────
    config:
      client:
        name: nostr4.social
      contact_href: /contact/
      # The name in nostr.json that a lead is sent to.
      lead_recipient: hello
      # NIP-13 proof of work, in leading zero bits: on the kind 1069 response
      # from a one-time key, on the gift wrap of a lead message from one, and
      # from a signed-in visitor (who skips both). Each bit doubles the work.
      pow:
        response: 20
        anonymous: 18
        signed: 0
      limits:
        min_seconds: 3
        rate:
          window: 600000
          max: 3

  - type: callout
    band: raised
    head:
      title: This is the argument, with your numbers in it.
      lede: >-
        The six lines come from the business case for Nostr. Read why each
        one exists, and what the protocol hands back, then tell us where our
        estimate is wrong.
    actions:
      - label: Read Nostr 4 Social Apps
        href: /nostr/
      - label: Book a Free Consult
        href: /contact/?subject=Free+consult
        style: primary
