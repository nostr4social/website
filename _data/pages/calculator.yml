# The calculator: the /nostr/ argument with the reader's own numbers in it.
# Six cost lines, two columns, a range on every figure, and every assumption
# on the page where it can be changed. The form is a Nostr form: a submission
# is a kind 1069 event encrypted to the form's key, and the page says so.
#
# Rules for this page:
# - Overclaiming is the risk. Typical is the headline; the range is the claim.
# - The non-custodial column is never zero where an obligation remains.
# - Nothing about the person is ever in the results link.

meta:
  title: Cost of Custody Calculator
  description: >-
    Estimate what holding your users' accounts and data costs you a year, in
    six lines, and what each line looks like after a Nostr integration. Every
    assumption is sourced and editable.

sections:
  - type: hero
    glow: left
    tight: true
    head:
      eyebrow: The business case, in numbers
      eyebrow_tone: gold
      title: Cost of Custody Calculator
      lede: >-
        Custody is a cost center. Put in what you already know about your app
        and see what holding your users costs you a year, line by line, and
        what remains of each line once users hold themselves. Every number
        here comes with its source, and every one can be changed.

  - type: calculator
    id: calculator

    # ── the form ─────────────────────────────────────────────────────────────
    # The same sections and questions as the form published on formstr.app;
    # _data/forms/map.yml says which question each key is sent as.
    form:
      title: Your numbers
      lede: >-
        The same questions as our Nostr form. Blank optional answers use the
        defaults listed under Assumptions.
      groups:
        - id: nostr
          title: Non Custody
          note: Which of these already hold for your app?
          fields: [nostr_grid]
        - id: users
          title: Accounts & Storage
          fields: [mau, posts_per_user, mb]
        - id: staffing
          title: Staffing Costs
          fields: [engineering_grid, moderation_grid, legal_usd]
        - id: payments
          title: Payment Gateway
          fields: [rails, rev, balances]
        - id: availability
          title: App Availability
          fields: [dist, jur]
      fields:
        mau:
          label: Number of Monthly Active Users (MAU)
          placeholder: "50000"
        posts_per_user:
          label: Average number of Posts or Messages per month per user
          placeholder: "20"
          note: Leave blank for twenty.
        mb:
          label: Average storage per user (in MB)
          placeholder: "50"
          note: Photos, video, attachments. Leave blank for 50 MB.
        engineering_grid:
          label: Software Engineering (hours per week)
          grid: true
          columns:
            "0": "0"
            "5": 1 to 10
            "25": 11 to 40
            "60": over 40
          rows:
            eng_accounts: Managing user accounts
            eng_content: Managing user content
            eng_infra: Managing infrastructure
            eng_legal: Legal and compliance
          note: A row left blank uses the default hours listed under Assumptions.
        moderation_grid:
          label: Content review & moderation (head count)
          grid: true
          columns:
            "0": "0"
            "5": 1 to 10
            "50": 11 to 100
            "500": 101 to 1000
            "2000": over 1000
          rows:
            mod_inhouse: In house (employees)
            mod_vendor: Outside vendor (seats)
          note: >-
            With nobody on either row, the moderation line shows what the
            benchmark says a function for your size costs.
        legal_usd:
          label: Legal, privacy and compliance (in USD, approximate per year)
          placeholder: optional
          note: If given, it replaces our estimate of your compliance programs.
        rails:
          label: What in-app payments do you facilitate in your app?
          options:
            p2p: Peer to Peer (bitcoin, lightning, or other crypto)
            apple: Apple in-app purchase
            google: Google Play billing
            processor: Third party processor (Stripe, PayPal, Adyen)
            reseller: Third party reseller (Paddle, Lemon Squeezy, FastSpring)
          note: Tick none if you take no payments. Revenue is split evenly across what you tick.
        rev:
          label: What is your approximate in-app revenue (gross monthly USD)
          placeholder: "20000"
        balances:
          label: Do you hold user balances, credits or wallets?
          options:
            "yes": "Yes"
        dist:
          label: How is your app distributed?
          options:
            apple: Apple App Store
            google: Google Play
            web: Web or direct
          note: Recorded with your answers; not priced.
        jur:
          label: What regions hold primary jurisdiction?
          options:
            eu: EU
            uk: UK
            us: US
            other: Other
        nostr_grid:
          label: "Our app already uses Nostr:"
          grid: true
          columns:
            "0": Never
            "0.5": Somewhat
            "1": Always
          rows:
            n_keys: User accounts are private keys
            n_raw_keys: App handles raw private keys
            n_signed_events: User data stored as signed events
            n_event_storage: User choice for event storage
            n_media_storage: User choice for media storage
            n_labels: Content tags and labels as signed events
            n_feeds: User configurable feeds & algos
            n_algos: User choice for algo processing
            n_p2p: Peer to peer in app payments
            n_nips: NIP standards published publicly
          note: >-
            Each row moves a cost line toward its non-custodial figure, all
            the way for Always and halfway for Somewhat. Handling raw private
            keys cancels the credit for user-held keys. The last row is
            recorded, not priced.
      contact:
        title: Personal Info
        note: >-
          Optional. If you leave your details, we can follow up on your
          numbers. They travel encrypted and never appear in the results link.
        fields:
          name:
            label: Your Name
            placeholder: optional
          company:
            label: Company Name
            placeholder: optional
          email:
            label: Email Address
            placeholder: optional
          npub:
            label: Nostr npub
            placeholder: optional
      honeypot_label: Leave this field empty
      submit:
        label: Calculate
        note: >-
          Results appear below at once. Your inputs are also saved as an
          encrypted Nostr form response, so we can see how the calculator is
          used; nothing readable leaves this tab.
      sign:
        guest_note: >-
          Saved with a one-time key, generated in this browser and discarded
          after use.
        bunker: Sign with Remote Bunker
        extension: Sign with Browser Extension
        switch: Switch

    # ── the results ──────────────────────────────────────────────────────────
    results:
      eyebrow: Your estimate
      title: What custody costs you
      hero:
        label: Custodial cost per year, typical
      tiles:
        noncustodial:
          label: On Nostr, per year
        per_mau:
          label: Per active user, per year
        saving:
          label: Released per year
      legend:
        custodial: Custodial today
        noncustodial: On Nostr
      columns:
        line: Cost line
        custodial: Custodial today
        noncustodial: On Nostr
        bars: Compared
        remains: What remains
      lines:
        - id: accounts
          icon: lock-closed
          title: Accounts & personal data
          remains: >-
            Age checks where the law demands them, and support for users who
            manage their own keys.
        - id: graph
          icon: hub
          title: Social graph & feeds
          remains: >-
            A client that assembles feeds from relays, and a ranking service
            you run or choose.
        - id: storage
          icon: storage
          title: Compute & storage
          remains: >-
            A relay or two for reliability, media you choose to host, and a
            thin cache.
        - id: compliance
          icon: doc
          title: Compliance & liability
          remains: >-
            Platform-content duties under the DSA and the Online Safety Act
            stay, and a privacy program for whatever you still retain.
        - id: moderation
          icon: gavel
          title: Moderation
          remains: >-
            Illegal-content reports, app-store policy, and appeals on what your
            app itself hosts. Ranking and discovery move to web of trust.
        - id: payments
          icon: card
          title: Payments
          remains: >-
            Store rules still apply to what is sold inside the app. Your own
            revenue can move to peer-to-peer rails at about 1% instead of
            3% plus 15 to 30%.
      already: Already on Nostr
      partly: Partly on Nostr
      implied: Benchmark-implied; nobody was given
      no_payments: No in-app payments
      actions:
        share:
          label: Share Results
          note: >-
            The link carries your inputs and any assumptions you changed.
            Nothing about you.
        contact:
          label: Sanity-check this number with us
        edit:
          label: Edit inputs
      link_label: Results link

    # ── the assumptions panel ────────────────────────────────────────────────
    assumptions:
      title: Assumptions
      summary: "Every number, its source, and a field to change it"
      intro: >-
        Typical is what the results show. Low and high bound the range beside
        every figure, and low always means the smaller cost. Change a typical
        value and the results update; the change travels in the results link.
      columns:
        what: What
        typical: Typical
        low: Low
        high: High
        unit: Unit
        confidence: Confidence
        source: Source
      confidence:
        high: sourced
        medium: derived
        low: weak
        unsourced: unsourced
      lines:
        shared: Used by more than one line
        accounts: Accounts & personal data
        graph: Social graph & feeds
        storage: Compute & storage
        compliance: Compliance & liability
        moderation: Moderation
        payments: Payments
      reset: Reset to typical
      files_label: The files behind this
      files:
        - label: assumptions.v1.json
          href: /calculator/assumptions.v1.json
        - label: assumptions.v1.md
          href: /calculator/assumptions.v1.md
      noscript: >-
        The calculator needs JavaScript to run. The assumptions it uses are
        listed here, with sources; for an estimate by hand, contact us.

    # ── strings the script needs ─────────────────────────────────────────────
    strings:
      range: "Range {low} to {high}"
      range_short: "{low} to {high}"
      per_mau_pair: "{custodial} today, {noncustodial} on Nostr"
      version: "Assumptions version {version}"
      share_done: Link copied
      contact_subject: Cost of custody estimate
      changed: changed
      details:
        show: Show the parts
        hide: Hide the parts
        tier_small: small-business tier
        tier_standard: standard tier
        us_small: below the CCPA threshold
        us_large: at or above the CCPA threshold
        people: "{n} people"
        rate: "{rate} applied"
        gb: "{gb} GB"
        defaulted: default hours
        reported: as reported
        holds: holds balances
      parts:
        auth: Authentication service
        resets: Password resets
        verify: Identity and age checks
        engineering: Engineering time
        key_support: Supporting self-managed keys
        database: Graph and metadata database
        feed_compute: Feed and recommendation compute
        ranking: Ranking provider
        blob: Media storage
        egress: Egress
        serving: Serving compute
        relay: A relay of your own
        privacy_programs: Compliance programs
        legal_labour: Engineering time on compliance
        dsar: Access requests
        insurance: Cyber insurance
        breach: Expected breach loss
        labour: Review labour
        appeals: Appeals and escalation
        tooling: Moderation tooling
        store_apple: Apple App Store commission
        store_google: Google Play commission
        processor: Payment processing
        reseller: Merchant of record
        p2p: Peer-to-peer rail
        money_transmitter: Money-transmitter avoidance
      status:
        saving: Saving your inputs as a Nostr form response
        mining: "Proving work on the response · {hashes} hashes"
        saved: "Saved as a Nostr form response · {ok} of {total} relays"
        failed: Could not reach a relay to save your inputs. Your results are unaffected.
        shared: Opened from a results link. Nothing was submitted.
      # The message hello receives when a submission carries contact details.
      compose:
        header: "via nostr4.social/calculator:"
        subject: Cost of custody lead
        results: "Custodial {custodial} a year; on Nostr {noncustodial}."
        link: "Results: {link}"
        name: Name
        company: Company
        email: Email
        npub: Nostr
      errors:
        required: "{field} is required."
        invalid: "{field} has a value this page does not recognise."
        not_a_number: "{field} must be a number."
        not_an_integer: "{field} must be a whole number."
        too_small: "{field} is too small."
        too_large: "{field} is larger than this model handles."
        unknown: Something went wrong. Reload and try again.
      money:
        year: per year
        per_mau: per active user per year

    # ── machine configuration ────────────────────────────────────────────────
    config:
      client:
        name: nostr4.social
      contact_href: /contact/
      # The name in nostr.json that a lead is sent to.
      lead_recipient: hello
      # NIP-13 proof of work, in leading zero bits: on the kind 1069 response
      # from a one-time key, on the gift wrap of a lead message from one, and
      # from a signed-in visitor (who skips both). Each bit doubles the work.
      pow:
        response: 20
        anonymous: 18
        signed: 0
      limits:
        min_seconds: 3
        rate:
          window: 600000
          max: 3

  - type: callout
    band: raised
    head:
      title: This is the argument, with your numbers in it.
      lede: >-
        The six lines come from the business case for Nostr. Read why each
        one exists, and what the protocol hands back, then tell us where our
        estimate is wrong.
    actions:
      - label: Read Nostr 4 Social Apps
        href: /nostr/
      - label: Book a Free Consult
        href: /contact/?subject=Free+consult
        style: primary
