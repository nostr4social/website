# The calculator: the /nostr/ argument with the reader's own numbers in it.
# Six cost lines, two columns, a range on every figure, and every assumption
# on the page where it can be changed. The form is a Nostr form: a submission
# is a kind 1069 event encrypted to the form's key, and the page says so.
#
# Rules for this page:
# - Overclaiming is the risk. Typical is the headline; the range is the claim,
#   and the range is Nostr4's thesis (the time to scale, what remains at scale,
#   the Nostr-native fees), never the custodial side's cloud prices.
# - The non-custodial column is never zero where an obligation remains.
# - Nothing about the person is ever in the results link.

meta:
  title: Non-Custodial Savings Calculator
  description: >-
    This calculator exposes the misunderstood cost center of holding custody, and the savings to be had by releasing custody, of user accounts and data in social apps.

sections:
  - type: hero
    glow: left
    tight: true
    # The lede runs the full width here: the page is a tool, not an essay.
    wide: true
    head:
      eyebrow: Nostr integration, justified
      eyebrow_tone: gold
      title: Non-Custodial Savings Calculator
      lede: |-
        Holding custody of user accounts and content is a cost most social apps carry without choosing to. It pays for authentication, storage, serving, moderation, compliance and the engineering behind all of it. Nostr lets an app release that custody to its users and to the network, and keep the brand, the product and the business.

        This calculator puts a number on it: what custody costs your app today, what the same app pays on Nostr, and the savings between the two.

  - type: calculator
    id: calculator
    # No band padding of its own: the tab bar sits close under the lede, and
    # the calculator sets its own bottom rhythm before the closing callout.
    flush: true

    # ── the form ─────────────────────────────────────────────────────────────
    # Every word of the form comes from the published form event (snapshot in
    # _data/forms/calculator.yml): section titles, questions, options, grid
    # rows and columns. Nothing here is form copy. What is here is how a
    # question is drawn: which number questions are sliders and over which
    # stops, and the page chrome around the form.
    form:
      # Number questions drawn as stepped sliders: the stops the slider
      # offers and how each stop is named. The key is the question's key in
      # _data/forms/map.yml. A number question without stops is a text input.
      sliders:
        mau:
          "1000": 1k
          "2000": 2k
          "5000": 5k
          "10000": 10k
          "20000": 20k
          "50000": 50k
          "100000": 100k
          "200000": 200k
          "500000": 500k
          "1000000": 1M
          "2000000": 2M
          "5000000": 5M
          "10000000": 10M
        posts_per_user:
          "1": "1"
          "2": "2"
          "5": "5"
          "10": "10"
          "20": "20"
          "50": "50"
          "100": "100"
          "200": "200"
          "500": "500"
          "1000": "1000"
        mb:
          "0": "0"
          "5": 5 MB
          "10": 10 MB
          "20": 20 MB
          "50": 50 MB
          "100": 100 MB
          "200": 200 MB
          "500": 500 MB
          "1000": 1 GB
          "2000": 2 GB
          "5000": 5 GB
        legal_usd:
          "0": "0"
          "1000": $1k
          "2000": $2k
          "5000": $5k
          "10000": $10k
          "20000": $20k
          "50000": $50k
          "100000": $100k
          "200000": $200k
          "500000": $500k
          "1000000": $1M
        rev:
          "0": "0"
          "1000": $1k
          "2000": $2k
          "5000": $5k
          "10000": $10k
          "20000": $20k
          "50000": $50k
          "100000": $100k
          "200000": $200k
          "500000": $500k
          "1000000": $1M
          "2000000": $2M
          "5000000": $5M
      # Grid columns are bands; the band's value is in the map. A column's
      # name comes from the form; nothing to add here.
      # Single-choice questions whose options are a scale, drawn as stepped
      # sliders rather than radio buttons. A list (kind of app, who moderates)
      # stays a list.
      scales: [nostr_now, growth, team, mod_heads]
      # Above the form card, as the results tab has its title and line.
      title: Your App Details
      intro: >-
        Seven questions is enough for a rough estimate. Add more details if you have them. The rest remains an assumption.
      honeypot_label: Leave this field empty
      # Each section opens with one question; these fold the rest in and out.
      more: Add more details
      less: Fewer details
      submit:
        label: Calculate
      # Back to the illustrative app: every answer cleared, every section folded.
      reset: Reset Values
      sign:
        guest_note: >-
          Saved with a one-time key, generated in this browser and discarded
          after use.
        bunker: Sign with Remote Bunker
        extension: Sign with Browser Extension
        switch: Switch

    # ── the tabs ─────────────────────────────────────────────────────────────
    tabs:
      cost: Calculator Results
      app: App Details
      assumptions: Assumptions
      # What the cost tab shows before anything has been calculated.
      empty: Fill in App Details and press Calculate.

    # ── the Save & Share modal ───────────────────────────────────────────────
    # Its title, description and questions come from the form's own section;
    # this is the chrome around them. Brief on purpose.
    modal:
      consent: You may email me about these results.
      save: Book a free consult with these results
      copy: Copy URL for Sharing
      close: Close
      switch: Switch
      # The disclosure under the button: closed by default, for visitors with a key of their own.
      sign_summary: Already on Nostr? Sign with your key
      sign_note: >-
        Sign with your browser extension or remote signer and the submission
        is yours to update or revisit later from any Nostr client. Otherwise a
        one-time key made in this tab signs it.
      sign_open: Choose how to sign
      # The dialog Save to Nostr opens: how the response is signed.
      sign:
        title: Sign the response
        extension: With my browser extension
        extension_note: Alby, nos2x, Amber. You can update or delete the response later from any Nostr client.
        bunker: With my remote signer
        bunker_note: nsec.app or any bunker. Same as above, approved on your signer.
        session: Without a key
        session_note: A disposable key made for this tab. Close the tab and it is gone; nothing can be updated or deleted later.
        cancel: Cancel

    # ── the results ──────────────────────────────────────────────────────────
    results:
      title: Estimated Savings
      # The pictures, in order, full width. The ids are the chart module's;
      # it also draws chart-cumulative-savings (the net cumulative by year
      # with the low case beneath it and the payback month marked) if listed
      # here.
      charts:
        - id: chart-custodial-cost-vs-nostr
          title: Projected Nostr Integration
          legend:
            custodial: Cost of Custody
            nostr: Cost of Nostr
          # {year} is the year the network is at scale; {months} and
          # {overlap} are the integration's calendar, filled by the script.
          caption: >-
            The Cost of Nostr line is what an app on Nostr pays each year:
            lower today, and falling as the network's standards and
            infrastructure scale. The gap in {year} is the figure above.
            Integration takes about {months} months and the two stacks
            overlap for {overlap} more; that cost is in the payback figure,
            not in the lines.
      # The three facts under the chart, all for the year Nostr is at scale,
      # like the figure in the chart and the savings list: the two costs per
      # user that year, and the Nostr cost that year. The custodial figure has
      # no range, since that side of the model is held at its typical values
      # in every case.
      stats:
        custodial_per_mau:
          label: "Custodial cost per user, {year}"
        nostr_per_mau:
          label: "Nostr cost per user, {year}"
        nostr_at_scale:
          label: "Nostr cost a year, {year}"
      # Measures down, years across from today; the script fills the year
      # heads and the cells, and writes the net cumulative beside the summary.
      years:
        summary: Year by year
        columns:
          year: Year
        rows:
          users: Active users
          custodial: Cost of Custody
          nostr: Cost of Nostr
          integration: Integration and overlap
          net: Saved (net)
          cumulative: Cumulative
      # Where the saving comes from: the six lines as the saving a year once
      # Nostr is at scale, which add up to the figure in the chart.
      table:
        title: Non-Custody Savings in Detail
      columns:
        line: Cost line
        saving: Saved per year
        share: Percent Saved
        remains: Nostr at Scale
      lines:
        - id: accounts
          icon: lock-closed
          title: Accounts & personal data
          remains: >-
            An age signal from the store or wallet where the law still asks
            for one, the signer login you still build, and a hand-off for
            users who need a key-management service.
        - id: graph
          icon: hub
          title: Social graph & feeds
          remains: >-
            A client that assembles feeds from relays, and a ranking or
            discovery provider you run or choose.
          goes: >-
            Feeds assemble on the client, and ranking is a service your users
            choose or you choose for them. Their follows, mutes and feed
            settings travel with them across apps.
        - id: storage
          icon: storage
          title: Compute & storage
          remains: >-
            Relay capacity for users who don't bring their own, rented from a
            provider who carries the hosting duties; media you choose to host;
            a thin cache; and the engineering to run them.
          goes: >-
            Users keep their events on relays and their media with hosts they
            choose, and both travel with them. You pay for the users who bring
            neither, as a sponsored or premium add-on.
        - id: compliance
          icon: doc
          title: Compliance & liability
          remains: >-
            Part of the DSA and Online Safety Act programs, for whatever you
            still host; a privacy program, access requests and a smaller
            breach exposure for whatever you still retain.
        - id: moderation
          icon: gavel
          title: Moderation
          remains: >-
            Illegal-content handling for any relay you run, app-store filter
            and report rules, and a label or web-of-trust provider. An app
            that rents relay capacity hosts nothing itself; the provider
            handles illegal content on its relays. Review and ranking move to
            the network.
          goes: >-
            Labels, trust scores and ranking are services on the network,
            shared across apps. A user's mutes and filters work in every
            client they use.
        - id: payments
          icon: card
          title: Payments
          remains: >-
            Store rules still apply to what is sold inside the app: outside
            the EU, Japan and the US link-out ruling, Apple still requires
            in-app purchase for digital goods. Your own revenue can move to
            peer-to-peer rails, bitcoin or stablecoins, at about 1% instead
            of 3% plus 15 to 30%. On-ramp costs fall on your users and
            affect conversion, not your P&L. For a marketplace: transaction
            revenue is not a cost line. On an open market, listings and
            settlement are peer to peer and the app is not a party to the
            sale, so there is no commission to save or to collect. See Conduit
            (conduit.market) and the Open Markets specification
            (openmarkets.pub).
      # Quiet notes under a line's name, where one applies.
      already: Already on Nostr
      partly: Partly on Nostr
      no_payments: No in-app payments
      # What integration involves: one sentence per piece, in the order the
      # integration runs; {weeks} is that piece's typical weeks from the
      # assumptions file, filled at build time. Then the doors.
      integration:
        title: What integration involves
        lines:
          - id: accounts
            text: "Accounts: signer login and the key hand-off, about {weeks} weeks."
          - id: graph
            text: "Graph: profiles, follows and feeds as signed events, about {weeks} weeks."
          - id: storage
            text: "Storage: relay connections, the outbox model and caching, about {weeks} weeks."
          - id: media
            text: "Media: user-chosen hosting, Blossom or similar, about {weeks} weeks."
          - id: moderation
            text: "Moderation: labels, web of trust and a ranking provider, about {weeks} weeks."
          - id: payments
            text: "Payments: your own revenue on a peer-to-peer rail, about {weeks} weeks."
        actions:
          - label: See Services
            href: /services/
            style: primary
          - label: Book a Free Consult
            href: /contact/?subject=Free+consult
      actions:
        edit:
          label: Customize App Details

    # ── the assumptions panel ────────────────────────────────────────────────
    assumptions:
      title: Our Assumptions
      intro: >-
        Typical is what the results show. Low and high bound the range beside
        every figure, and only the rows under "At scale: Nostr4's thesis" move
        it, so the band is a statement about the thesis, not about cloud
        pricing. Everything on the custodial side is held at its typical value
        in all three cases; the low and high beside those rows are reference
        points for you to override. Change a typical value, press Recalculate,
        and the change travels in the results link.
      # The one preamble for the rows that move the band.
      thesis_intro: >-
        These are not estimates of the world as it is but of the world Nostr4
        is building: the time for Nostr's standards and infrastructure to
        reach scale, the share of each cost that remains once an app hosts
        nothing of its own, and what the market will bear for the Nostr-native
        services that take its place. Low is the thesis holding less well and
        the smaller saving; high is it holding better.
      recalculate: Recalculate
      columns:
        what: What
        typical: Typical
        low: Low
        high: High
        unit: Unit
        confidence: Confidence
        source: Source
      confidence:
        high: sourced
        medium: derived
        low: weak
        unsourced: unsourced
      lines:
        thesis: "At scale: Nostr4's thesis"
        shared: Used by more than one line
        accounts: Accounts & personal data
        graph: Social graph & feeds
        storage: Compute & storage
        compliance: Compliance & liability
        moderation: Moderation
        payments: Payments
      reset: Reset to typical
      files_label: The files behind this
      files:
        - label: assumptions.v3.json
          href: /calculator/assumptions.v3.json
        - label: assumptions.v3.md
          href: /calculator/assumptions.v3.md
      noscript: >-
        The calculator needs JavaScript to run. The assumptions it uses are
        listed here, with sources; for an estimate by hand, contact us.

    # ── strings the script needs ─────────────────────────────────────────────
    strings:
      range: "Range {low} to {high}"
      range_short: "{low} to {high}"
      per_mau_pair: "{custodial} today, {noncustodial} on Nostr"
      # The headline: the cash saving a year at scale, a range with typical
      # inside it; the risk saving on its own smaller line.
      headline: "{low} to {high} a year, typically {typical}"
      headline_sub: "in {year}, at {users} active users"
      headline_risk: "plus {risk} a year less breach exposure"
      # Under it, dim: what the network would deliver this year to an app
      # already integrated, and beside it the payback month.
      today_if: "{amount} a year if you were integrated today"
      payback: "Pays back in month {n}"
      no_payback: Does not pay back within five years
      # Under the headline, in the body ink, counted from the file at build time.
      sourced_line: "{sourced} of {total} assumptions are sourced; every one is listed, graded and yours to change."
      sourced_link: See Assumptions
      # Beside the year-by-year summary: the net cumulative, after integration.
      cumulative_note: "{amount} net over five years, after integration"
      # The moderation line when the form says nobody moderates: the benchmark it would have billed.
      moderation_nobody: "No moderation today. Benchmarks put it at about {people} people, {cost} a year. On Nostr that work moves to the network; nothing is saved because nothing is spent."
      # "How this is calculated": the dialog a part opens. {a.key} is an
      # assumption's value in use, {i.key} an input, {p.key} the part's own
      # number, {d.key} a derived one. Each formula has a today and a Nostr line.
      how:
        title: How this is calculated
        rests_on: Rests on
        adjust: Adjust Assumptions
        changed: changed
        meta: "{low} to {high} · {confidence}"
        at_scale: "At scale ({d.scale_year}, {d.scale_users} users): {p.custodial} of custody becomes {p.noncustodial} on Nostr. That is the figure in the savings list."
        showing: "Showing the {n} assumptions behind {part}."
        show_all: Show all
        # The same dialog for the integration behind the payback figure. {w.key}
        # is a figure of the integration: the weeks per piece, their total, the
        # loaded hour, the cost, the engineers, the months, the overlap, and the
        # first month the custodial stack is off.
        integration:
          title: Integration and overlap
          weeks_label: Person-weeks
          cost_label: Cost and time
          weeks: "Accounts {w.accounts}, graph {w.graph}, storage {w.storage}, media {w.media}, moderation {w.moderation}, payments {w.payments}: {w.total} person-weeks, each piece scaled by what you already have on Nostr."
          cost: "{w.total} person-weeks × 40 hours × {w.hourly} an hour, fully loaded = {w.cost}. With {w.engineers} engineers that is about {w.months} months, then {w.overlap} months with both stacks running and nothing saved yet; the custodial stack is off from month {w.live}."
          none: "Nothing to integrate: your app is already on Nostr."
        # A unit's word beside a value in the dialog, singular and plural.
        units:
          week: week
          weeks: weeks
          month: month
          months: months
        # The CCPA test, shown with the programs and the access requests where the app has US users.
        ccpa: "The CCPA counts consumers a year: {i.mau} users × {a.annual_users_per_mau} × {p.us_share} in the US × {a.ca_share_of_us_users} in California = {p.ca_consumers}, against a threshold of {a.ccpa_consumer_threshold}."
        confidence:
          high: sourced
          medium: derived
          low: weak source
          unsourced: unsourced
        programs:
          gdpr: GDPR program
          osa: UK Online Safety Act
          dsa: Digital Services Act
          us_small: US privacy program, below the CCPA threshold
          us_large: US privacy program, at or above the CCPA threshold
          none: no program applies in the regions given
        formulas:
          auth:
            today: "{i.mau} users × {a.auth_per_mau_month} a month × 12 = {p.custodial}"
            nostr: "Nothing. Keys replace accounts, so there is no authentication service to pay for."
          resets:
            today: "{i.mau} users × {a.reset_rate_per_mau_year} resets a year × {a.reset_cost} a reset = {p.custodial}"
            nostr: "Nothing. Keys cannot be reset, so there is no reset to support."
          verify:
            today: "{i.mau} users × {p.rate} checked a year (each region's share of users at that region's rate) × {a.verify_price} a check = {p.custodial}"
            nostr: "{a.verify_remains_share} of checks remain at scale, where the law still reaches the client: {p.noncustodial}"
          engineering_accounts:
            today: "{p.hours} hours a week × {d.weeks} weeks × {p.hourly} an hour, fully loaded = {p.custodial}"
            nostr: "{a.accounts_eng_remains_share} remains at scale, for signer login, recovery hand-off and sessions: {p.noncustodial}"
          key_handoff:
            today: "Nothing today."
            nostr: "{i.mau} users × {a.reset_rate_per_mau_year} key hand-offs a year × ({a.support_self_service_contact} self-service + {a.key_handoff_live_share} of them live at {a.support_live_contact}) = {p.noncustodial}"
          database:
            today: "{p.gb} GB ({i.mau} users × {a.db_mb_per_mau} MB, plus {p.posts} posts a month kept {d.retention} months at {a.db_kb_per_post} KB) × {a.db_gb_month} a GB-month × 12 = {p.custodial}"
            nostr: "Nothing. The graph lives on relays."
          feed_compute:
            today: "{i.mau} users × {a.compute_per_mau_year} a year × {a.feed_compute_share} of it on feeds = {p.custodial}"
            nostr: "Nothing. Feeds assemble on the client."
          engineering_graph:
            today: "{p.hours} hours a week × {d.weeks} weeks × {p.hourly} an hour, fully loaded = {p.custodial}"
            nostr: "{a.graph_eng_remains_share} remains at scale, for the client's own feed logic: {p.noncustodial}"
          ranking:
            today: "Nothing today."
            nostr: "{i.mau} users × {a.ranking_fee_per_mau_year} a year for a ranking or discovery provider = {p.noncustodial}"
          blob:
            today: "{i.mau} users × {i.mb} MB = {p.gb} GB × {a.blob_gb_month} a GB-month × 12 = {p.custodial}"
            nostr: "{a.media_sponsor_share} remains at scale, for media you still choose to host: {p.noncustodial}"
          egress:
            today: "{i.mau} users × {a.egress_gb_per_mau_month} GB a month × 12 = {p.gb} GB × {a.egress_gb} a GB = {p.custodial}"
            nostr: "{a.media_sponsor_share} remains at scale, for the media you still host: {p.noncustodial}"
          serving:
            today: "{i.mau} users × {a.compute_per_mau_year} a year × {p.share} of it on serving = {p.custodial}"
            nostr: "{i.mau} users × {a.cache_per_mau_year} a year for a thin cache = {p.noncustodial}"
          engineering_storage:
            today: "{p.hours} hours a week × {d.weeks} weeks × {p.hourly} an hour, fully loaded = {p.custodial}"
            nostr: "{a.infra_eng_remains_share} remains at scale, for relay connections, caching and media handling: {p.noncustodial}"
          relay:
            today: "Nothing today."
            nostr: "Capacity for the {a.relay_sponsored_share} of users who don't bring their own: the greater of {a.relay_floor_year} a year and {i.mau} × {a.relay_sponsored_share} × {a.relay_per_mau_year} = {p.noncustodial}"
          privacy_programs:
            today: "{d.programs} = {p.custodial}. {d.ccpa}"
            nostr: "{a.content_law_remains_share} of the content-law programs remain at scale, for whatever you still host, and {a.privacy_remains_share} of the privacy programs, for whatever you still retain: {p.noncustodial}"
          privacy_programs_reported:
            today: "Your reported legal, privacy and compliance spend, {p.custodial}, replaces the estimate."
            nostr: "Of that, at scale, the content-law part ({p.content_law}) remains at {a.content_law_remains_share} and the rest at {a.privacy_remains_share}: {p.noncustodial}"
          legal_labour:
            today: "{p.hours} hours a week × {d.weeks} weeks × {p.hourly} an hour, fully loaded = {p.custodial}"
            nostr: "{a.privacy_remains_share} remains at scale, for whatever you still retain: {p.noncustodial}"
          dsar:
            today: "{p.users} users under a privacy law (the EU and the UK always, the US once the CCPA applies, counted as consumers a year) × {a.dsar_rate_per_mau_year} access requests a year × {a.dsar_cost} each, automated = {p.custodial}"
            nostr: "The same rate on the {a.retained_data_share} of personal data still held at scale: {p.noncustodial}"
          insurance:
            today: "A small company's cyber policy: {a.cyber_insurance_year} a year."
            nostr: "{a.insurance_remains_share} remains at scale: {p.noncustodial}"
          breach:
            today: "An expected loss, not a bill: {a.breach_prob_year} chance a year × the lesser of {a.breach_cost_cap} and {i.mau} users × {a.breach_cost_per_user} = {p.custodial}"
            nostr: "The same chance, on the {a.retained_data_share} of personal data still held at scale: {p.noncustodial}"
          labour_implied:
            today: "No reviewers were given, so {a.mods_per_million_mau} per million users gives {p.people} people × {p.loaded} a year, fully loaded = {p.custodial}"
            nostr: "{a.moderation_remains_share} remains at scale, for whatever you host yourself: {p.noncustodial}"
          labour_team:
            today: "{p.people} on your team × {p.loaded} a year, fully loaded = {p.custodial}"
            nostr: "{a.moderation_remains_share} remains at scale, for whatever you host yourself: {p.noncustodial}"
          labour_vendor:
            today: "{p.people} vendor seats × {a.moderator_seat_outsourced} a year, all-in = {p.custodial}"
            nostr: "{a.moderation_remains_share} remains at scale, for whatever you host yourself: {p.noncustodial}"
          labour_nobody:
            today: "Nobody moderates today: nothing is spent."
            nostr: "Nothing is saved. Benchmarks would put this at {p.benchmark_people} people, {p.benchmark_cost} a year."
          appeals:
            today: "{a.appeals_share} of review labour, for appeals and escalation = {p.custodial}"
            nostr: "{a.moderation_remains_share} remains at scale: {p.noncustodial}"
          tooling:
            today: "{i.mau} users × {a.ts_tooling_per_mau_year} a year for classifiers, queues and hash matching = {p.custodial}"
            nostr: "{a.tooling_remains_share} remains at scale, for hash matching on what you host: {p.noncustodial}"
          labels:
            today: "Nothing today."
            nostr: "{i.mau} users × {a.label_provider_per_mau_year} a year for a label or web-of-trust provider = {p.noncustodial}"
          store_apple:
            today: "{p.revenue} a year through the App Store × {p.rate} ({d.tier}) = {p.custodial}"
            nostr: "The same. Store rules still apply to what is sold inside the app."
          store_google:
            today: "{p.revenue} a year through Google Play × {p.rate} ({d.tier}) = {p.custodial}"
