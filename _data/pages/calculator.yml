# The calculator: the /nostr/ argument with the reader's own numbers in it.
# Six cost lines, two columns, a range on every figure, and every assumption
# on the page where it can be changed. The form is a Nostr form: a submission
# is a kind 1069 event encrypted to the form's key, and the page says so.
#
# Rules for this page:
# - Overclaiming is the risk. Typical is the headline; the range is the claim,
#   and the range is Nostr4's thesis (what remains once the network is
#   mature, the Nostr-native fees), never the custodial side's cloud prices.
# - The non-custodial column is never zero where an obligation remains.
# - Nothing about the person is ever in the results link.

meta:
  title: Non-Custodial Savings Calculator
  description: >-
    This calculator estimates the often overlooked cost of holding custody of user accounts and data in a social app, and the savings our model projects when non-custody becomes a business model.

sections:
  - type: hero
    glow: left
    tight: true
    # The lede runs the full width here: the page is a tool, not an essay.
    wide: true
    head:
      eyebrow: Nostr integration, justified
      eyebrow_tone: gold
      title: Non-Custodial Savings Calculator
      lede: |-
          Holding custody of user accounts and content is a cost most social apps carry without choosing to. Account support, data storage, security, moderation, compliance and the engineering behind all of it add up to a figure few apps ever see in one place. Nostr integration lets an app release that custody burden and put its effort into the brand and the product instead.

          This calculator estimates what custody costs your app today, what a similar app would cost to run on Nostr, and the saving between the two.

  - type: calculator
    id: calculator
    # No band padding of its own: the tab bar sits close under the lede, and
    # the calculator sets its own bottom rhythm before the closing callout.
    flush: true

    # ── the form ─────────────────────────────────────────────────────────────
    # Every word of the form comes from the published form event (snapshot in
    # _data/forms/calculator.yml): section titles, questions, options, grid
    # rows and columns. Nothing here is form copy. What is here is how a
    # question is drawn: which number questions are sliders and over which
    # stops, and the page chrome around the form.
    form:
      # Number questions drawn as stepped sliders: the stops the slider
      # offers and how each stop is named. The key is the question's key in
      # _data/forms/map.yml. A number question without stops is a text input.
      sliders:
        mau:
          "1000": 1k
          "2000": 2k
          "5000": 5k
          "10000": 10k
          "20000": 20k
          "50000": 50k
          "100000": 100k
          "200000": 200k
          "500000": 500k
          "1000000": 1M
          "2000000": 2M
          "5000000": 5M
          "10000000": 10M
        posts_per_user:
          "1": "1"
          "2": "2"
          "5": "5"
          "10": "10"
          "20": "20"
          "50": "50"
          "100": "100"
          "200": "200"
          "500": "500"
          "1000": "1000"
        mb:
          "0": "0"
          "5": 5 MB
          "10": 10 MB
          "20": 20 MB
          "50": 50 MB
          "100": 100 MB
          "200": 200 MB
          "500": 500 MB
          "1000": 1 GB
          "2000": 2 GB
          "5000": 5 GB
        legal_usd:
          "0": "0"
          "1000": $1k
          "2000": $2k
          "5000": $5k
          "10000": $10k
          "20000": $20k
          "50000": $50k
          "100000": $100k
          "200000": $200k
          "500000": $500k
          "1000000": $1M
        p2p_volume:
          "0": "0"
          "1000": $1k
          "2000": $2k
          "5000": $5k
          "10000": $10k
          "20000": $20k
          "50000": $50k
          "100000": $100k
          "200000": $200k
          "500000": $500k
          "1000000": $1M
          "2000000": $2M
          "5000000": $5M
      # Grid columns are bands; the band's value is in the map. A column's
      # name comes from the form; nothing to add here.
      # Single-choice questions whose options are a scale, drawn as stepped
      # sliders rather than radio buttons. A list (kind of app, who moderates)
      # stays a list.
      scales: [nostr_now, growth, team, mod_heads]
      # Above the form card, as the results tab has its title and line.
      title: Your App Details
      intro: >-
        Seven questions is enough for a rough estimate. Add more details if you have them. The rest remains an assumption.
      honeypot_label: Leave this field empty
      # Each section opens with one question; these fold the rest in and out.
      more: Add more details
      less: Fewer details
      submit:
        label: Calculate
      # Back to the illustrative app: every answer cleared, every section folded.
      reset: Reset Values
      sign:
        bunker: Sign with Remote Bunker
        extension: Sign with Browser Extension
        switch: Switch

    # ── the tabs ─────────────────────────────────────────────────────────────
    tabs:
      cost: Calculator Results
      app: App Details
      assumptions: Assumptions
      # What the cost tab shows before anything has been calculated.
      empty: Fill in App Details and press Calculate.

    # ── the Save & Share modal ───────────────────────────────────────────────
    # Its title, description and questions come from the form's own section;
    # this is the chrome around them. Brief on purpose.
    modal:
      consent: You may email me about these results.
      # Under the questions: what sending does with the answers, in the page's
      # own terms, by the signer in use. The script swaps them: the one-time
      # key is kept in sessionStorage for the tab and says exactly that; a
      # signed-in visitor can ask the relays to delete the event, so their
      # note says so.
      data_note_session: >-
        Sending publishes your answers as a response on public Nostr relays,
        encrypted to Nostr4, which grants Nostr4 access to them; nothing is
        stored on Nostr4's servers. Nostr4 reads the response and uses any
        contact details only to follow up. Saved with a one-time key kept for
        this tab. Closing the tab discards it, and after that no one can delete
        the event.
      data_note_signed: >-
        Sending publishes your answers as a response on public Nostr relays,
        encrypted to Nostr4 and signed with your key, which grants Nostr4 access
        to them; nothing is stored on Nostr4's servers. Nostr4 reads the
        response and uses any contact details only to follow up. You can ask
        the relays to delete it at any time.
      save: Book a free consult with these results
      copy: Copy URL for Sharing
      close: Close
      switch: Switch
      # The disclosure under the button: closed by default, for visitors with a key of their own.
      sign_summary: Already on Nostr? Sign with your key
      sign_note: >-
        Sign with your browser extension or remote signer and the submission
        is yours to update or revisit later from any Nostr client. Otherwise a
        one-time key made in this tab signs it. The response itself is public
        on the relays; its contents are encrypted to Nostr4.
      sign_open: Choose how to sign
      # The dialog Save to Nostr opens: how the response is signed.
      sign:
        title: Sign the response
        extension: With my browser extension
        extension_note: Alby, nos2x, Amber. You can update the response later from any Nostr client, or ask the relays to delete it.
        bunker: With my remote signer
        bunker_note: nsec.app or any bunker. Same as above, approved on your signer.
        session: Without a key
        session_note: A disposable key made for this tab. Close the tab and it is gone; nothing can be updated or deleted later.
        cancel: Cancel

    # ── the results ──────────────────────────────────────────────────────────
    results:
      title: Estimated Savings
      # The picture, full width. The id is the chart module's.
      charts:
        - id: chart-custodial-cost-vs-nostr
          title: "Projected cost of a custodial app vs the same app on Nostr:"
          legend:
            custodial: Cost of Custody
            nostr: Cost of Nostr
          # The caption's opening; the script adds the window, the headline's
          # instant and the breach line (strings.chart.caption_*,
          # strings.headline.note).
          caption: >-
            This chart shows the cost of custody for your app today, and the same app running on Nostr. The gap between the lines is the saving.
      # The three facts beside the chart, all at the instant the headline is
      # read, like the figure in the chart and the savings list: the two
      # costs per user then, and the Nostr cost a year then. The custodial
      # figure has no range, since that side of the model is held at its
      # typical values in every case.
      stats:
        custodial_per_mau:
          label: Custodial cost per user
        nostr_per_mau:
          label: Nostr cost per user
        nostr_at_scale:
          label: Cost of Nostr app, a year
      # The button at the end of the chart's caption: the breach dialog, the
      # arithmetic and the cyber-policy cross-check side by side.
      headline:
        how: "How breach risk is estimated →"
      # Above the results whenever an assumption was overridden.
      custom:
        text: This result uses custom assumptions, not Nostr4's defaults.
        reset: "Reset to defaults →"
      # Measures down, years across from today; the script fills the year
      # heads and the cells. Every cell is the run-rate at that instant;
      # nothing is cumulative.
      years:
        summary: Year by year
        columns:
          year: Year
        rows:
          users: Active users
          custodial: Cost of Custody
          nostr: Cost of Nostr
          realised: Estimated Saving
      # Where the saving comes from: the six lines as the saving a year at
      # the instant the headline is read, which add up to the headline.
      table:
        title: Non-Custody Savings in Detail
      columns:
        line: Cost area
        saving: Estimated savings a year
        share: Estimated Share Saved
        remains: Post Integration
      # Post Integration: what responsibility remains for a fully
      # non-custodial app on Nostr once the network is mature. One or two
      # plain sentences a row; a summary, nothing more.
      lines:
        - id: accounts
          icon: lock-closed
          title: Accounts & personal data
          remains: >-
            Apps integrate signer login and point users who need help with
            their keys to a key-management service. Where the law asks for an
            age signal, you read it from the network or the wallet.
        - id: graph
          icon: hub
          title: Social graph & feeds
          remains: >-
            Apps assemble feeds on the client from third party services. Ranking and
            discovery come from a provider chosen by apps or users.
        - id: storage
          icon: storage
          title: Compute & storage
          remains: >-
            Apps may rent relay capacity for the users who don't bring their own
            and choose to host only selected media. A thin cache and the
            engineering to run it may also be provided by apps.
        - id: compliance
          icon: doc
          title: Compliance & liability
          remains: >-
            In our reading, content-law duties follow only what apps choose to host,
            and privacy duties, access requests and breach exposure follow
            what apps choose to retain.
        - id: moderation
          icon: gavel
          title: Moderation
          remains: >-
            Review, ranking and filtering come from label and web-of-trust providers on the network, chosen by users. Apps answer for the defaults a new user starts with, the report and block controls that app stores require, and any storage relay run by the app.
        - id: payments
          icon: card
          title: Payments
          remains: >-
            Payments between users settle on their own rails. An app-store may still claim its commission on peer-to-peer payments until the precedent for non-custodial payments is settled. An app selling its own products in-app still pays the app-store's commission. The volume you give is split evenly across the rails you name.
      # Quiet notes under a line's name, where one applies.
      already: Already on Nostr
      partly: Partly on Nostr
      no_payments: No in-app payments
      actions:
        edit:
          label: Customize App Details
        # A quiet link to the responses page, for the form's key holder.
        responses:
          label: Saved responses
          href: /calculator/responses/

    # ── the assumptions panel ────────────────────────────────────────────────
    assumptions:
      title: Our Assumptions
      intro: >-
        Typical is what the results show. Low and high bound the range beside
        every figure, and only the rows under "Network mature: Nostr4's thesis" move
        it, so the band is a statement about the thesis, not about cloud
        pricing. Everything on the custodial side is held at its typical value
        in all three cases; the low and high beside those rows are reference
        points for you to override. Change a typical value, press Recalculate,
        and the change travels in the results link.
      # The one preamble for the rows that move the band.
      thesis_intro: >-
        These are not estimates of the world as it is but of the world Nostr4
        is building: the share of each cost that remains once an app hosts
        nothing of its own and the network is mature, and what the market
        will bear for the Nostr-native services that take its place. Low is the thesis holding less well and
        the smaller saving; high is it holding better.
      recalculate: Recalculate
      columns:
        what: What
        typical: Typical
        low: Low
        high: High
        unit: Unit
        confidence: Confidence
        source: Source
      confidence:
        high: sourced
        medium: derived
        low: weak
        unsourced: unsourced
      lines:
        thesis: "Network mature: Nostr4's thesis"
        timeline: "The timeline: when the network matures, when the headline is read"
        shared: Used by more than one line
        accounts: Accounts & personal data
        graph: Social graph & feeds
        storage: Compute & storage
        compliance: Compliance & liability
        moderation: Moderation
        payments: Payments
      reset: Reset to typical
      files_label: The files behind this
      files:
        - label: assumptions.v4.json
          href: /calculator/assumptions.v4.json
        - label: assumptions.v4.md
          href: /calculator/assumptions.v4.md
      noscript: >-
        The calculator needs JavaScript to run. The assumptions it uses are
        listed here, with sources; for an estimate by hand, contact us.

    # ── strings the script needs ─────────────────────────────────────────────
    strings:
      range: "Range {low} to {high}"
      range_short: "{low} to {high}"
      # A slider standing on a suggestion, for assistive tech: not an answer.
      suggested_valuetext: "Suggested: {label}"
      # In the custom-assumptions banner, when a value in the link was out of range.
      custom:
        clamped: "Out-of-range values were clamped: {list}."
      # The end of the chart's caption, filled by the script: the breach
      # exposure, calculated apart from the saving. {breach} is set in bold;
      # when the reduction is zero the sentence and its button are left out.
      headline:
        note: "Calculated separately: about {breach} a year of breach exposure that Nostr also reduces, with no passwords and little private data to lose."
      per_mau_pair: "{custodial} today, {noncustodial} on Nostr"
      # The moderation line when the form says nobody moderates: the benchmark it would have billed.
      moderation_nobody: "No moderation today. Benchmarks put it at about {people} people, {cost} a year. On Nostr that work moves to the network; nothing is saved because nothing is spent."
      # "How this is calculated": the dialog a part opens. {a.key} is an
      # assumption's value in use, {i.key} an input, {p.key} the part's own
      # number, {d.key} a derived one. Each formula has a today and a Nostr line.
      how:
        title: How this is calculated
        rests_on: Rests on
        adjust: Adjust Assumptions
        changed: changed
        meta: "{low} to {high} · {confidence}"
        # The foot of the dialog: the same part at the instant the headline is read; the breach, an exposure, says it is not in the headline.
        estimated: "{d.estimated_months} months from today ({d.estimated_users} users): {p.custodial} of custody becomes {p.noncustodial} on Nostr. That is the figure in the savings list."
        estimated_risk: "{d.estimated_months} months from today: {p.custodial} a year of exposure becomes {p.noncustodial}, about {d.breach_reduction} a year less. An exposure, not a saving: it is noted under the headline and counted in nothing."
        showing: "Showing the {n} assumptions behind {part}."
        show_all: Show all
        # A unit's word beside a value in the dialog, singular and plural.
        units:
          month: month
          months: months
        # The CCPA test, shown with the programs and the access requests where the app has US users.
        ccpa: "The CCPA counts consumers a year: {i.mau} users × {a.annual_users_per_mau} × {p.us_share} in the US × {a.ca_share_of_us_users} in California = {p.ca_consumers}, against a threshold of {a.ccpa_consumer_threshold}."
        confidence:
          high: sourced
          medium: derived
          low: weak source
          unsourced: unsourced
        programs:
          gdpr: GDPR program
          osa: UK Online Safety Act
          dsa: Digital Services Act
          us_small: US privacy program, below the CCPA threshold
          us_large: US privacy program, at or above the CCPA threshold
          none: no program applies in the regions given
        formulas:
          auth:
            today: "{i.mau} users × {a.auth_per_mau_month} a month × 12 = {p.custodial}"
            nostr: "Nothing. Keys replace accounts, so there is no authentication service to pay for."
          resets:
            today: "{i.mau} users × {a.reset_rate_per_mau_year} resets a year × {a.reset_cost} a reset = {p.custodial}"
            nostr: "Nothing. A key cannot be reset by the app, so there is no reset to support."
          verify:
            today: "{i.mau} users × {p.rate} checked a year (each region's share of users at that region's rate) × {a.verify_price} a check = {p.custodial}"
            nostr: "{a.verify_remains_share} of checks remain once the network is mature, where the law still reaches the client: {p.noncustodial}"
          engineering_accounts:
            today: "{p.hours} hours a week × {d.weeks} weeks × {p.hourly} an hour, fully loaded = {p.custodial}"
            nostr: "{a.accounts_eng_remains_share} remains once the network is mature, for signer login, recovery hand-off and sessions: {p.noncustodial}"
          key_handoff:
            today: "Nothing today."
            nostr: "{i.mau} users × {a.reset_rate_per_mau_year} key hand-offs a year × ({a.support_self_service_contact} self-service + {a.key_handoff_live_share} of them live at {a.support_live_contact}) = {p.noncustodial}"
          database:
            today: "{p.gb} GB ({i.mau} users × {a.db_mb_per_mau} MB, plus {p.posts} posts a month kept {d.retention} months at {a.db_kb_per_post} KB) × {a.db_gb_month} a GB-month × 12 = {p.custodial}"
            nostr: "Nothing. The graph lives on relays."
          feed_compute:
            today: "{i.mau} users × {a.compute_per_mau_year} a year × {a.feed_compute_share} of it on feeds = {p.custodial}"
            nostr: "Nothing. Feeds assemble on the client."
          engineering_graph:
            today: "{p.hours} hours a week × {d.weeks} weeks × {p.hourly} an hour, fully loaded = {p.custodial}"
            nostr: "{a.graph_eng_remains_share} remains once the network is mature, for the client's own feed logic: {p.noncustodial}"
          ranking:
            today: "Nothing today."
            nostr: "{i.mau} users × {a.ranking_fee_per_mau_year} a year for a ranking or discovery provider = {p.noncustodial}"
          blob:
            today: "{i.mau} users × {i.mb} MB = {p.gb} GB × {a.blob_gb_month} a GB-month × 12 = {p.custodial}"
            nostr: "{a.media_sponsor_share} remains once the network is mature, for media you still choose to host: {p.noncustodial}"
          egress:
            today: "{i.mau} users × {a.egress_gb_per_mau_month} GB a month × 12 = {p.gb} GB × {a.egress_gb} a GB = {p.custodial}"
            nostr: "{a.media_sponsor_share} remains once the network is mature, for the media you still host: {p.noncustodial}"
          serving:
            today: "{i.mau} users × {a.compute_per_mau_year} a year × {p.share} of it on serving = {p.custodial}"
            nostr: "{i.mau} users × {a.cache_per_mau_year} a year for a thin cache = {p.noncustodial}"
          engineering_storage:
            today: "{p.hours} hours a week × {d.weeks} weeks × {p.hourly} an hour, fully loaded = {p.custodial}"
            nostr: "{a.infra_eng_remains_share} remains once the network is mature, for relay connections, caching and media handling: {p.noncustodial}"
          relay:
            today: "Nothing today."
            nostr: "Capacity for the {a.relay_sponsored_share} of users who don't bring their own: the greater of {a.relay_floor_year} a year and {i.mau} × {a.relay_sponsored_share} × {a.relay_per_mau_year} = {p.noncustodial}"
          privacy_programs:
            today: "{d.programs} = {p.custodial}, the GDPR, Online Safety Act and DSA programmes scaled by {p.factor} for {d.team} (the DSA to a token below the top tier). {d.ccpa}"
            nostr: "{a.content_law_remains_share} of the content-law programs remain once the network is mature, for whatever you still host, and {a.privacy_remains_share} of the privacy programs, for whatever you still retain: {p.noncustodial}"
          privacy_programs_reported:
            today: "Your reported legal, privacy and compliance spend, {p.custodial}, replaces the estimate."
            nostr: "Of that, once the network is mature, the content-law part ({p.content_law}) remains at {a.content_law_remains_share} and the rest at {a.privacy_remains_share}: {p.noncustodial}"
          legal_labour:
            today: "{p.hours} hours a week × {d.weeks} weeks × {p.hourly} an hour, fully loaded = {p.custodial}"
            nostr: "{a.privacy_remains_share} remains once the network is mature, for whatever you still retain: {p.noncustodial}"
          dsar:
            today: "{p.users} users under a privacy law (the EU and the UK always, the US once the CCPA applies, counted as consumers a year) × {a.dsar_rate_per_mau_year} access requests a year × {a.dsar_cost} each, automated = {p.custodial}"
            nostr: "The same rate on the {a.retained_data_share} of personal data still held once the network is mature: {p.noncustodial}"
          insurance:
            today: "A small company's cyber policy: {a.cyber_insurance_year} a year."
            nostr: "{a.insurance_remains_share} remains once the network is mature: {p.noncustodial}"
          breach:
            today: "An expected loss, not a bill: {a.breach_prob_year} chance of a breach in a year × {p.loss}, the median loss for a firm with {d.team} (IRIS 2025) = {p.custodial}. Cross-check from the insurance side: a small-business cyber policy costs {a.cyber_insurance_year} a year, and insurers expect to pay out only a fraction of that per policy; the policy covers part of a loss, this figure counts all of it, so the two are not in conflict."
            nostr: "The same chance, on the {a.retained_data_share} of personal data still held once the network is mature, with no passwords to lose: {p.noncustodial}"
          labour_implied:
            today: "No reviewers were given, so {a.mods_per_million_mau} per million users gives {p.people} people × {p.loaded} a year, fully loaded = {p.custodial}"
            nostr: "{a.moderation_remains_share} remains once the network is mature, for whatever you host yourself: {p.noncustodial}"
          labour_team:
            today: "{p.people} on your team × {p.loaded} a year, fully loaded = {p.custodial}"
            nostr: "{a.moderation_remains_share} remains once the network is mature, for whatever you host yourself: {p.noncustodial}"
          labour_vendor:
            today: "{p.people} vendor seats × {a.moderator_seat_outsourced} a year, all-in = {p.custodial}"
            nostr: "{a.moderation_remains_share} remains once the network is mature, for whatever you host yourself: {p.noncustodial}"
          labour_nobody:
            today: "Nobody moderates today: nothing is spent."
            nostr: "Nothing is saved. Benchmarks would put this at {p.benchmark_people} people, {p.benchmark_cost} a year."
          appeals:
            today: "{a.appeals_share} of review labour, for appeals and escalation = {p.custodial}"
            nostr: "{a.moderation_remains_share} remains once the network is mature: {p.noncustodial}"
          tooling:
            today: "{i.mau} users × {a.ts_tooling_per_mau_year} a year for classifiers, queues and hash matching = {p.custodial}"
            nostr: "{a.tooling_remains_share} remains once the network is mature, for hash matching on what you host: {p.noncustodial}"
          labels:
            today: "Nothing today."
            nostr: "{i.mau} users × {a.label_provider_per_mau_year} a year for a label or web-of-trust provider = {p.noncustodial}"
          store_apple:
            today: "{p.revenue} a year through the App Store × {p.rate} ({d.tier}) = {p.custodial}"
            nostr: "{p.revenue} × {p.rate} × {a.p2p_store_fee_remains_share} store commission while the precedent is open, plus {p.revenue} × {a.lightning_rate} on the user's rail = {p.noncustodial}"
          store_google:
            today: "{p.revenue} a year through Google Play × {p.rate} ({d.tier}) = {p.custodial}"
            nostr: "{p.revenue} × {p.rate} × {a.p2p_store_fee_remains_share} store commission while the precedent is open, plus {p.revenue} × {a.lightning_rate} on the user's rail = {p.noncustodial}"
          processor:
            today: "{p.revenue} a year × {p.rate}, plus {p.tickets} payments × {p.fixed} = {p.custodial}"
            nostr: "{p.revenue} × {a.lightning_rate} on the user's rail = {p.noncustodial}"
          reseller:
            today: "{p.revenue} a year × {p.rate}, plus {p.tickets} payments × {p.fixed} = {p.custodial}"
            nostr: "{p.revenue} × {a.lightning_rate} on the user's rail = {p.noncustodial}"
          p2p:
            today: "{p.revenue} a year × {a.lightning_rate} = {p.custodial}"
            nostr: "The same: {p.noncustodial}"
          money_transmitter_holds:
            today: "Legal work on money-transmitter exposure while balances are held: {a.mt_avoidance_year} a year."
            nostr: "{a.mt_remains_share} remains once the network is mature: {p.noncustodial}"
          money_transmitter:
            today: "Nothing. No balances are held."
            nostr: "Nothing."
      # Whose estimate the tab shows: the illustrative app's, or the visitor's.
      # The line under the title: whose estimate, and the app it describes,
      # one piece per section, all bold. A piece the visitor answered is
      # bright; one the openers assumed stays in the body ink.
      whose:
        illustrative: Estimated
        yours: Your estimate
        frame: "{lead} for {kind} app {reach} that is {nostr}, has {mau} active users {growth}, with {team}, {moderation}, and facilitates {payments} a month in in-app payments."
        kind:
          none: any
          messaging: a messaging
          feed: a media feed
          community: a community
          marketplace: a marketplace
        team:
          one: one founder
          ten: a team of up to 10
          fifty: a team of up to 50
          more: a team of more than 50
        moderation:
          benchmark: moderation at benchmark levels
          nobody: no moderation
          team: in-house moderation
          vendor: third-party moderation
        payments:
          none: $0
          some: "{volume}"
        reach:
          in: "in {list}"
          join: " and "
          eu: the EU
          uk: the UK
          us: the US
          other: other regions
        nostr:
          "0": not on Nostr
          "0.5": partially Nostr integrated
          "1": fully Nostr integrated
        # The growth band, after the user count; the form's own bands.
        growth:
          "0": holding flat
          "0.25": growing about 25% a year
          "0.5": growing about 50% a year
          "1": doubling each year
        link: Customize App Details
      # The years along the chart are the app's: today, then today plus one
      # to five years. Only the network's dates are absolute; the caption
      # names them.
      chart:
        today: Today
        year: "Year {n}"
        # Along the dotted edge, inside the hatched area, in the Nostr line's colour.
        wedge: integration window
        # The caption's tail, after the page's own sentences. {window}, {at}
        # and {after} are spans derived from the two timeline assumptions:
        # "two-year", "year three", "one year" when they are whole years,
        # "24-month", "month 36", "12 months" otherwise (strings.chart.spans).
        caption_window: "Integration cost is not estimated here, but payback should land within the {window} integration window."
        caption_estimated: "The gold rule marks the estimated savings in {at}, {after} after the window."
        spans:
          # Whole years, as words; a span that is not whole years falls back to months.
          words: [zero, one, two, three, four, five, six, seven, eight, nine, ten]
          window_years: "{n}-year"
          window_months: "{n}-month"
          at_years: "year {n}"
          at_months: "month {n}"
          after_years: "{n} year"
          after_years_plural: "{n} years"
          after_months: "{n} months"
        tip:
          users: "{n} active users"
        versus:
          band_sub: Estimated savings
          users: Active Users
          tip_custody: "Cost of Custody: {amount}"
          tip_nostr: "Cost of Nostr: {amount}"
          tip_nostr_today: "If integrated today: {amount}"
          tip_saving: "Estimated saving: {amount}"
          aria: "Today custody costs {custodial} a year against {nostr} if integrated today; in year five, {end_custodial} against {end_nostr}. The hatched wedge is the {window} integration window. The gold rule marks the estimated savings of {saving} a year in {at}, {after} after the window."
      version: "Assumptions version {version} · calculated as of {date}"
      # Beside the version: three counts from what the rows carry.
      sourcing: "{sourced} sourced, {replaceable} defaults you can replace, {thesis} are our thesis"
      # Beside the version, at the foot of the tab: what the figures are and are not.
      disclaimer: Estimates from public benchmarks and Nostr4's assumptions; not legal, tax or financial advice.
      contact_subject: Cost of custody estimate
      # What the Save & Share modal says at runtime.
      modal:
        needed: "Still needed: {list}"
        consent_name: your consent to email
        signed: Signed with your key. You can update this later from any Nostr client, or ask the relays to delete it.
        saved: "Sent · {ok} of {total} relays · event {id}"
      changed: changed
      details:
        show: Show the Savings
        hide: Hide the Savings
        # The three columns beneath a line, and its foot row.
        part: Item
        today: Cost of Custody
        on_nostr: Cost of Nostr
        total: Total
        tier_small: small-business tier
        tier_standard: standard tier
        us_small: below the CCPA threshold
        us_large: at or above the CCPA threshold
        people: "{n} people"
        people_default: "{n} people, a default count"
        seats: "{n} vendor seats"
        seats_default: "{n} vendor seats, a default count"
        people_implied: "about {n} people, from benchmarks"
        rate: "{rate} applied"
        checked: "{rate} of users checked a year"
        gb: "{gb} GB"
        # Where an engineering part's hours came from.
        defaulted: based on a default; enter your hours in Customize
        defaulted_team: "based on a default for {team}; enter your hours in Customize"
        hours_given: "based on your {hours} hours a week"
        reported: as reported
        holds: holds balances
        expected_loss: expected loss, not a bill
        relay_minimum: one managed relay
        dsar_users: "{n} users under a privacy law"
        # Fees on in-app payments and an expected loss sit apart from the bills, each group with its own sub-total.
        cash: Cash costs
        fees: Fees on in-app payments
        risk: Risk exposure
      parts:
        auth: Authentication service
        resets: Password resets
        verify: Identity and age checks
        engineering: Engineering time
        key_handoff: Key management hand-off
        database: Graph and metadata database
        feed_compute: Feed and recommendation compute
        ranking: Ranking provider
        blob: Media storage
        egress: Egress
        serving: Serving compute
        relay: A relay of your own
        privacy_programs: Compliance programs
        legal_labour: Engineering time on compliance
        dsar: Access requests
        insurance: Cyber insurance
        breach: Expected breach loss
        labour: Review labour
        appeals: Appeals and escalation
        tooling: Moderation tooling
        labels: Label or web-of-trust provider
        store_apple: Apple App Store commission
        store_google: Google Play commission
        processor: Payment processing
        reseller: Merchant of record
        p2p: Peer-to-peer rail
        money_transmitter: Money-transmitter avoidance
      status:
        saving: Saving your inputs as a Nostr form response
        mining: "Preparing your submission…"
        mining_count: "{hashes} hashes"
        saved: "Saved as a Nostr form response · {ok} of {total} relays"
        failed: Could not reach a relay to save your inputs. Your results are unaffected.
        shared: Opened from a results link. Nothing was submitted.
        # A saved response restores the calculation only, never the contact fields.
        older_version: "Opened from a results link made with assumptions version {from}; shown with version {to}. Nothing was submitted."
        opening: Opening the saved response...
        opened: "Opened a response sent {when}, {how}."
        opened_responder: with the key that sent it
        opened_holder: as its recipient
        opened_plain: which was not encrypted
      # The message hello receives when a submission carries contact details.
      compose:
        header: "via nostr4.social/calculator:"
        subject: Non-custodial savings lead
        # In front of the subject while the calculator is in test mode, or the response is flagged test.
        subject_test: "[TEST] "
        date: "Calculated as of {date}."
        results: "Custody today about {custodial} a year; the same app on Nostr about {noncustodial}."
        estimated: "Estimated savings: about {amount} a year ({low} to {high})."
        fees: "Of which fees on payments between users: about {amount} a year."
        breach: "Breach exposure reduced: about {amount} a year (not in the saving)."
        link: "Results: {link}"
        open: "Open in the calculator: {link}"
      errors:
        required: "{field} is required."
        invalid: "{field} has a value this page does not recognise."
        not_a_number: "{field} must be a number."
        not_an_integer: "{field} must be a whole number."
        too_small: "{field} is too small."
        too_large: "{field} is larger than this model handles."
        too_fast: That was quick. Give it a moment and send again.
        restore_missing: That response was not found on the relays.
        restore_not_ours: That link does not point at a response to this form. Nothing was opened.
        restore_malformed: That response could not be read. Nothing was opened.
        restore_locked: >-
          To open a sent response, sign in with the key that sent it, or as
          Nostr4.
        rate_limited: That is three sends in ten minutes. Give it a rest.
        unknown: Something went wrong. Reload and try again.
      money:
        year: per year
        per_mau: per active user per year

    # ── machine configuration ────────────────────────────────────────────────
    config:
      client:
        name: nostr4.social
      contact_href: /contact/
      # The name in nostr.json that a lead is sent to.
      lead_recipient: hello
      # The version of the consent line (modal.consent) a response records
      # when the box is ticked; bump it when the wording changes.
      consent_version: "1"
      # The proof-of-work thresholds and the calculator mode are shared
      # configuration, in _data/blocks/nostr_config.yml, so the readers
      # enforce the same numbers the page mines.
      limits:
        min_seconds: 3
        rate:
          window: 600000
          max: 3

  - type: callout
    band: raised
    # The two doors stack, so the lede keeps its width.
    stack: true
    head:
      title: Non-Custody is how Nostr scales.
      # {mature_year} is the year of network_mature_end in the current
      # assumptions, filled at build time (lib/text.html): never typed here.
      lede: >-
        Nostr4 exists to grow the network of independent social apps. We are
        actively developing the infrastructure and standards, and the
        onboarding services, for apps to release custody of users and their content while simultaneously expanding their own user base and reducing costs. We expect non-custody to be fully supported on Nostr by
        {mature_year}, at which time every integrated app will be able to realize the full benefits of being on this network.
    actions:
      - label: Learn About Nostr
        href: /nostr/
      - label: See Our Services
        href: /services/
      - label: Book a Free Consult
        href: /contact/?subject=Free+consult
        style: primary
