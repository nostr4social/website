# The contact page. The form is the argument: a company that tells you it never
# holds your plaintext should be able to show you, and the code is right there.
#
# Three doors in the hero (phone, email, Nostr), then the composer. One message
# goes to one recipient, chosen from /.well-known/nostr.json.

meta:
  title: Contact
  description: >-
    Send an encrypted Nostr message straight from the browser, or email us.
    No server ever holds the plaintext.

sections:
  - type: hero
    glow: left
    head:
      eyebrow: Get in touch
      title: Contact Us
    # The three doors, directly under the title on the hero's own ground.
    list:
      columns: 3
      # They follow the page's h1 directly, so they are its h2s.
      item_level: h2
      items:
        - title: Phone
          body: >-
            We are still setting up a phone contact method. Please message us directly for best results.
        - title: Email
          body: >-
            Click to send an email message to our company inbox.
          # Assembled by the script rather than written into the page, so the
          # address is not sitting in the source for a scraper.
          email:
            user: hello
            domain: nostr4.social
            subject: "[nostr4.social] Contact"
        - title: Nostr
          body: >-
            Click to copy our pubkey into any Nostr client.
          code: npub1n0str479lul4smnvquvy33f8ljxkw073fmd0x7tspvkpssjmyggqjdv79a
          # The script turns the code into a click-to-copy button with these words.
          copy:
            label: Copy our pubkey
            done: Copied

  - type: contact-form
    id: send
    head:
      title: Send an encrypted message
      lede: >-
        This private message will be encrypted and sent over Nostr. It is
        sealed in your browser, carried by public relays, and opened only by
        the recipient who holds the private key. No account is required, and
        no server holds a copy with any traceable information.

    # ── the markup Jekyll renders ────────────────────────────────────────────
    fields:
      to:
        label: To
        note: Everyone listed is verified against nostr4.social.
      subject:
        label: Subject
        placeholder: What is your project or topic of inquiry?
      message:
        label: Message
        placeholder: Tell us where Nostr might fit, or where it clearly does not.
      reply:
        label: Reply to
        placeholder: you@example.com, or an npub
        note: >-
          If you would like a reply, provide an email address, a phone number,
          or a handle. This will be encrypted with the message.
      # The off-screen field. Nobody sees it; nothing legitimate fills it.
      honeypot_label: Leave this field empty

    send:
      anonymous: Send Anonymously
      signed: Send encrypted
      guest_note: >-
        Sign with a one-time key, generated in this browser and discarded
        after use.
      or: OR
      bunker: Sign with Remote Bunker
      extension: Sign with Browser Extension
      switch: Switch

    # The chain beside the composer. Each node carries a line for each state
    # the send can be in; the script swaps them as the state machine moves.
    travel:
      eyebrow: How it travels
      items:
        - icon: phone
          tone: gold
          title: Your browser
          rest: >-
            Seals the message with NIP-44. A one-time key also stamps the wrapper
            with proof of work, so a flood costs something and a visitor does not.
          active: Sealing the message to the recipient's key...
          mining: Stamping the wrapper with proof of work. A few seconds, once.
          done: Sealed to one recipient. Nothing readable has left this tab.
        - icon: storage
          tone: purple
          title: Relays
          rest: Carry a wrapped event they cannot open, addressed to the recipient you chose.
          active: Publishing to the relays the recipient reads private messages on...
          done: Accepted the wrapped event. They still cannot read it.
          failed: No relay accepted the wrapped event. Nothing was delivered.
        - icon: people
          tone: rust
          title: Nostr4
          rest: The recipient opens it with their own key, and replies the same way.
          active: Waiting.
          done: In the recipient's inbox. The reply goes to the address you gave.

    # The modal the "Sign with Remote Bunker" link opens.
    bunker:
      title: Sign with Remote Bunker
      scan: >-
        Scan this with your signer, or open it directly. The page asks for two
        permissions only: seal one message and sign it.
      copy: Copy URI
      paste_title: Or paste a bunker URI
      paste_label: bunker:// URI from your signer
      paste_note: >-
        A name@domain identifier is not accepted here, because resolving it
        would mean this page making a request to someone else's server.
      connect: Connect
      cancel: Cancel
      waiting: Waiting for your signer...

    result:
      details: Details
      again: Send another
      copy: Copy receipt
      retry: Try again

    unavailable:
      title: The form cannot start.
      note: >-
        We could not load the list of recipients, so there is nothing to
        encrypt to. Email works, and reaches the same people.

    email:
      noscript: >-
        This form needs JavaScript to encrypt anything. Without it, email us at
        hello@nostr4.social.

    how_it_works:
      title: How this works
      summary: No server · NIP-17 over NIP-44 · what relays see · what we keep
      items:
        - title: There is no server.
          body: >-
            This page is static files. Your message is encrypted in this tab and
            published straight to relays. Nothing we run ever holds a plaintext
            copy, because there is nothing to hold it.
        - title: The encryption is NIP-44, and it happens here.
          body: >-
            Your message becomes an unsigned kind 14 rumor, sealed to the
            recipient as a kind 13, then wrapped in a kind 1059 under a key that
            exists only for that one event. Only the recipient can unwrap it.
        - title: Why sending takes a few seconds.
          body: >-
            A message signed with a one-time key carries a NIP-13 proof of work:
            your browser repeats a hash until the wrapper's id begins with enough
            zero bits. That costs a visitor a few seconds, once. It costs a flood
            the same for every message, which is what lets an inbox relay refuse
            the cheap ones. A message signed with your own key skips it.
        - title: Who can read it.
          body: >-
            The recipient you chose, and nobody else. Every name offered is
            listed in this domain's NIP-05 file. If you are signed in, you get a
            copy too, so the conversation appears in your own client.
        - title: What the relays see.
          body: >-
            An encrypted blob, the recipient it is addressed to, and your IP
            address, the same as any other connection you make. They cannot see
            who sent it, what it says, or when it was written.
        - title: What we keep.
          body: >-
            Nothing this page can give us. No analytics, no logs, no third-party
            requests. The only network traffic this page makes is to
            nostr4.social and to the relays named on screen.
        - title: What this does not do.
          body: >-
            There is no forward secrecy in NIP-44: a key that leaks later can
            decrypt messages sent earlier. Relay operators can see metadata
            about the wrapper. If that matters for what you are about to say,
            say less here and more on a call.
      links_label: The standards this uses
      links:
        - label: NIP-17 · private direct messages
          href: https://github.com/nostr-protocol/nips/blob/master/17.md
        - label: NIP-44 · encryption
          href: https://github.com/nostr-protocol/nips/blob/master/44.md
        - label: NIP-59 · gift wrap
          href: https://github.com/nostr-protocol/nips/blob/master/59.md
        - label: NIP-07 · browser extensions
          href: https://github.com/nostr-protocol/nips/blob/master/07.md
        - label: NIP-46 · remote signing
          href: https://github.com/nostr-protocol/nips/blob/master/46.md
      source_label: Read the code that does this
      source_href: /assets/js/contact/contact.js

    # ── strings the script needs at runtime ──────────────────────────────────
    strings:
      recipients:
        # Display names for entries in nostr.json; anything unlisted shows its name.
        labels:
          hello: Nostr4
        self_copy: A copy to you
        from_link: from the link you followed
      identity:
        nip07: Signed in with your extension. A copy lands in your own DMs.
        nip46: Signed in with your remote signer. A copy lands in your own DMs.
        unnamed: Signed in
      status:
        connecting_nip07: Waiting for your extension to approve...
        connecting_nip46: Connecting to your signer...
      bunker:
        qr_alt: Connection URI as a QR code
        copied: Copied.
        waiting: Waiting for your signer...
        auth_note: Your signer needs you to approve this in a browser tab.
        auth_open: Open the approval page
      # The plaintext of the message, as the recipient's client shows it. The
      # first line is what an inbox list displays, so it names the source.
      compose:
        header: "via Nostr4 website:"
        subject_line: "Subject: {subject}"
        footer_reply: "Reply to: {reply}"
        footer_guest: >-
          Sent with a one-time key that was discarded after sending. A reply
          over Nostr will not arrive; use the address above.
        footer_signed: ""
      sending:
        resolving: Finding inbox relays
        encrypting: Sealing
        mining: Proving work
        mining_detail: "{hashes} hashes · {seconds}s"
        publishing: Publishing
        note_guest: Sealed with a one-time key. Nothing readable has left this tab.
        note_signed: Sealed with your own key. Nothing readable has left this tab.
      result:
        delivered: Delivered
        not_delivered: Not delivered
        relay_ok: accepted
        relay_failed: "refused · {reason}"
        relays_count: "{ok} of {total} relays accepted"
        event_id: Wrapper event
        sent_at: "Sent {time} · {key}"
        key_guest: one-time key discarded
        key_signed: signed with your own key
        reply_to: "The reply goes to {reply}."
        reply_none: >-
          No reply-to was given, so the recipient cannot answer. Send another
          with one, or email.
        reply_self: The reply lands in your own DMs.
        copied: Receipt copied.
        fallback_warning: >-
          This recipient has not published an inbox relay list, so a public
          fallback set was used. They may not be reading these relays.
        success:
          title: Sent.
          body: >-
            Delivered to {name}. Sealed in this tab and accepted by {ok} of
            {total} relays. Only the holder of that key can open it.
        failure:
          title: Not sent.
          body: >-
            No relay accepted the message for {name}. Nothing was delivered,
            and nothing was stored. Try again, or email.
        receipt: >-
          Sent to {name} ({nip05}) via nostr4.social/contact at {time}.
          Relays: {relays}. Wrapper event: {id}.
      errors:
        unknown: Something went wrong. Email works, if this keeps failing.
        honeypot: ""
        too_fast: That was quick. Give it a moment and send again.
        message_short: A little more detail would help. Twenty characters minimum.
        message_long: That is longer than a message can be. Trim it, or email us.
        subject_long: The subject is too long.
        recipient_missing: Choose who the message goes to.
        rate_limited: That is three messages in ten minutes. Give it a rest.
        nip07_missing: >-
          No browser extension was found. Install Alby, nos2x or Amber and
          reload, or sign with a remote bunker.
        nip07_no_nip44: >-
          Your extension does not support NIP-44 encryption, which this form
          requires. Update it, or sign with a remote bunker.
        nip07_refused: Your extension declined to share a public key.
        nip07_bad_pubkey: Your extension returned something that is not a public key.
        bunker_empty: Paste a bunker URI first.
        bunker_bad_scheme: That is not a bunker URI. It should start with bunker://
        bunker_is_nip05: >-
          A name@domain identifier would mean this page contacting someone
          else's server, which it never does. Paste the bunker:// URI instead.
        bunker_unparseable: That URI could not be read.
        bunker_bad_pubkey: That bunker URI has no valid public key in it.
        bunker_no_relay: That bunker URI names no relay, so there is nowhere to reach the signer.
        nip46_connect_failed: >-
          Could not reach your remote signer. Check that it is running and that
          it approved the connection.
        nip46_no_pubkey: Your remote signer connected but would not share a public key.
        nip46_bad_pubkey: Your remote signer returned something that is not a public key.
        guest_closed: That one-time key has already been used. Reload to start again.
        recipients_unavailable: >-
          Could not load the list of people this form sends to. Email works.
        recipients_malformed: The recipient list is not readable. Email works.
        recipients_empty: The recipient list is empty. Email works.
        recipients_bad_override: The ?to= override is not a valid npub or hex key.

    # ── machine configuration the script needs ───────────────────────────────
    config:
      client:
        name: nostr4.social
      relays:
        discovery:
          - wss://purplepag.es
          - wss://relay.nostr.band
          - wss://relay.damus.io
          - wss://nos.lol
        fallback_dm:
          - wss://relay.damus.io
          - wss://nos.lol
          - wss://relay.primal.net
          - wss://relay.0xchat.com
        nip46:
          - wss://relay.nsec.app
          - wss://relay.damus.io
      # NIP-13 proof of work on the gift wrap, in leading zero bits. A browser
      # hashes a wrap-sized preimage about 120k times a second per core, so 18
      # bits (260k hashes on average) is a second or two on a desktop and a few
      # on a phone, and a flood pays the same for every message. Each bit
      # doubles it. Zero turns it off. Signed-in senders have a key with a
      # history; they skip it.
      pow:
        anonymous: 18
        signed: 0
      timeouts:
        discovery: 4000
        profile: 3000
        publish: 8000
        nip46_connect: 120000
      limits:
        message:
          min: 20
          max: 5000
        subject:
          max: 120
        min_seconds: 3
        rate:
          window: 600000
          max: 3
      nip46:
        # A curated list, not NIP-89 discovery: discovery would mean trusting
        # whatever an unknown relay advertises, on a page about not doing that.
        signers:
          - label: Open in nsec.app
            nostrconnect_url: https://nsec.app/connect?uri={uri}
