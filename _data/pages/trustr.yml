# The product page. Problem, then solution, then the parts, then the flow —
# each section makes one move, and the rust marks the parts we implement.

meta:
  title: TrustR
  description: >-
    TrustR is a recommendation and discovery provider for non-custodial social
    apps, built on the open TSM standard.

sections:
  - type: hero
    glow: left
    cast: trustr_cast
    cast_type: hub
    head:
      eyebrow: Product · live since April 2026
      title: TrustR
      lede: >-
        TrustR is our flagship recommendation and discovery provider for
        non-custodial social apps. Under the hood, ranking
        algorithms are highly configurable and portable across providers. On the surface, platforms don't need to manage feed algorithms, they become a shared commodity that anyone can generate or consume.
    actions:
      - label: Launch the Demo
        href: https://trustr.ing
        style: primary
        external: true
      - label: Join our Research Group
        href: /contact/?subject=Research+group

  - type: split
    title: Nostr has a problem ...
    body: >-
      How does one discover trustworthy content and users on a "trustless"
      network that nobody owns? The classic "Web of Trust" answer is to
      calculate trust scores relative to each observer (client user), for every
      pubkey (network user) interacting with and around that observer.


      The double whammy for Nostr is that these calculations are pretty heavy to
      run locally on a mobile app for every client user, and that client apps
      have little choice but to do so. Nostr lacks a standard for requesting
      such custom calculations as each client user might need for a given search
      or desired user experience.
    punch: >-
      Any social app (even a Nostr client) that holds custody over
      recommendation or discovery algorithms, is still on the hook for
      moderating and controlling user content.
    aside:
      title: ... without a standard for trust.
      tone: recessed
      items:
        - eyebrow: Users get
          title: Vendor Lock In
          body: >-
            Users are limited to whichever algorithm their current app chose to
            build. A configuration cannot be carried to another app, a result
            cannot be inspected, and two providers cannot be compared.
        - eyebrow: Apps get
          title: More Cost Burden
          body: >-
            Apps that hold custody over recommendation and discovery carry the
            full cost of computing them and the full liability for moderating
            what they surface. Neither cost is shared with the network.
        - eyebrow: Services get
          title: No Layering of Results
          body: >-
            Every service computes every request from scratch. Using another
            provider's results requires a separate integration with each one,
            so no provider's work builds on another's.
        - eyebrow: Nostr gets
          title: More Centralized
          body: >-
            Recommendation and discovery fall to the few providers that can
            afford the compute. The network's curation centralizes around them.

  - type: split
    glow: left
    tight: true
    wide: true
    title: TrustR has a solution ...
    bright: true
    body: >-
      TrustR calculates Web of Trust in the cloud, freeing apps to simply publish requests and retrieve results. Using the TSM standard, apps can publish their own requests from any user point of view, or retrieve results from their user's already published request. 


      TSM (Trust Service Machines) is an open source Nostr standard for trust services. Any app can send the same request to any provider,
      and one provider's output can be sent to another as input. TSM compatibility allows apps and providers to become non-custodial processors recommendation and discovery, rather than controllers.
    punch: >-
      Social apps on Nostr can offload the burden of content moderation, simply by allowing users to choose their own algorithms for recommendation and discovery.
    aside:
      title: ... with interoperability.
      tone: lifted
      items:
        - eyebrow: Users get
          title: Algorithmic Sovereignty
          body: >-
            A user's configuration is a signed Nostr event. It can be sent to any
            TSM compatible provider without modification, and it can be forked,
            shared, or combined with others.
        - eyebrow: Apps get
          title: Open Marketplace
          body: >-
            Providers compete on quality, freshness, privacy, and price. An app
            chooses a provider, or lets the user choose, instead of building and
            maintaining one.
        - eyebrow: Services get
          title: Distributed Compute
          body: >-
            Results are addressable Nostr events, so one provider's output can be
            another provider's input. The cost of answering the same question is
            paid once and shared.
        - eyebrow: Nostr gets
          title: Decentralized Curation
          body: >-
            Many algorithms run on the network, each computed from a user's own
            point of view. The capture of any one provider changes nothing for
            the others.

  - type: chain
    band: sunk
    head:
      title: MVP Demo
      lede: >-
        Our TrustR demo shows off three separate TSM services. It uses the results from one as the input for the next. Each one accepts standard TSM requests and publishes standard results as signed Nostr events. This MVP models how independent providers can interoperate on the network, preserving non-custody for apps and services.
    items:
      - title: Baseline Web of Trust
        body: Your personal spam filter based on follows, mutes, and reports across the network ranked from your point of view.
      - title: Topical Search
        body: Retrieve notes or articles that have been published within your baseline web of trust, and ranked on semantic relevance to a search topic.
      - title: Topical Influence
        body: Rerank authors from the topical search based on semantic relevance and by engagement on the ranked posts.
    note: 
    actions:
      - label: Launch the Demo
        href: https://trustr.ing
        style: primary
        external: true


  - type: cards
    id: standards
    band: sunk
    head:
      title: Open Standards and Open Source
      lede: >-
        Interoperability preserves non-custody for apps and services by allowing the user to choose. Below are the open source standards and libraries that we have developed and maintain alongside TrustR. 
    items:
      - icon: insights
        title: GrapeRank TSM
        body: >-
          Nostr's first (and only) Web-of-Trust library for non-custodial apps and services. It allows anyone to run a GrapeRank service, ingesting event interactions from across the network to generate highly configurable user rankings from any point of view. 
        link:
          label: GrapeRank on GitHub
          href: https://github.com/graperank/tsm-graperank-library
      - icon: verified
        title: TSM
        body: >-
          Trust Service Machines (TSM) is a Nostr standard for trust service providers to announce the services that they offer, for users to publish requests (privately or publicly), and for results to be published in a discoverable manner that apps may consume.
        link:
          label: Read the TSM spec
          href: https://gitworkshop.dev/manime@nostr4.social/relay.ngit.dev/tsm
      - icon: hub
        title: NAS
        body: >-
          Nostr Archive Standards (NAS) is a Nostr standard for the production and discovery of event archives. Nostr relays are a poor mechanism for reliable delivery of bulk or older events. NAS provides a standard format upon which network aggregation and analytics can operate while preserving user-custody of published events.
        link:
          label: Read the NAS spec
          href: https://gitworkshop.dev/manime@nostr4.social/relay.ngit.dev/nas

  - type: list
    head:
      title: Audience
    columns: 2
    items:
      - title: Client apps
        body: >-
          Social apps that need a feed for users who have no Web of Trust of
          their own yet, or a custom ranking for a particular view. TrustR
          computes it from a standard request, and the app never holds the
          algorithm.
      - title: Relay services
        body: >-
          Personal and paid relays that filter by trust instead of by keyword.
          TSM processing can be resold, white labeled, as a value add for relay
          customers.
      - title: Curators
        body: >-
          Users and organizations that publish rankings as a service. A
          curator's TSM request is a signed event, so any app or user can
          subscribe to its results.
      - title: Power users
        body: >-
          Users who already curate and want their rankings to follow them
          between apps. Any TSM compatible app can consume the results of a
          request published from the user's own point of view.

  - type: zones
    head:
      title: Architecture
      lede_bright: true
      lede: >-
        TrustR is built on six instances across three interfaces. The Public
        Interface is standard Nostr: a dashboard where users configure and publish
        TSM requests, and a relay that carries those requests, the feedback, and the
        results as signed Nostr events. The Listener Interface is a single Service
        Orchestrator, the only instance that reads the public relay and calls the
        Compute Interface behind it. That gated compute (GrapeRank, NDE, and the Archive
        Relay) is private to TrustR and reachable only through the orchestrator.


        Apps and users depend only on the Public Interface, which is defined by the
        TSM standard and not by TrustR. Any TSM compatible provider can replace
        everything behind it (Listener and Compute interfaces) without a change to any app, and requests and results
        remain signed events on public relays that any app may consume.
    zones:
      - label: Public Interface
        wide: true
        nodes:
          - icon: phone
            title: TrustR Dashboard
            note: Configure a request. Watch it resolve.
            steps: [1, 10]
          - icon: storage
            title: TrustR Relay
            note: >-
              For published TSM events: announcements, requests, feedback,
              outputs.
            steps: [0, 2, 9]
      - label: Listener Interface
        nodes:
          - icon: hub
            title: Service Orchestrator
            note: >-
              The only component that touches both sides. Holds the service
              keys, and signs every output.
            steps: [3, 8]
      - label: Compute Interface
        wide: true
        nodes:
          - icon: scatter
            title: GrapeRank
            note: Influence ranking from interpreted interactions.
            steps: [4, 6, 7]
          - icon: scatter
            title: NDE
            note: Topical ranking from semantic embeddings.
          - icon: storage
            title: Archive Relay
            note: Events scanned from public relays, stored locally.
            steps: [5]
    outside:
      label: Outside TrustR
      nodes:
        - icon: broadcast
          tone: gold
          title: Public relays, scanned continuously

  - type: flow
    head:
      title: Example Request Flow
      lede: >-
        One GrapeRank ranking, start to finish. The same shape holds for any TSM
        service.
    items:
      - step: "0"
        text: >-
          **Before anything** **—** the *Service Orchestrator* has published its
          service announcements. The *Archive Relay* is already scanning public
          relays for notes, articles, profiles, follow lists, mutes, reports and
          zaps. Both run continuously.
      - step: "1"
        text: >-
          **The reader configures** **—** in the *TrustR Dashboard*. Which
          service, whose point of view, and which interactions to interpret.
      - step: "2"
        text: >-
          **The request is published** **—** as a signed event to the *TrustR
          Relay*. From here it is public Nostr data, not an API call.
      - step: "3"
        text: >-
          **The Orchestrator picks it up** **—** on its announced relays. It
          checks the subscription, then calls the service over a private
          interface and holds the connection open.
      - step: "4"
        text: >-
          **The point of view resolves** **—** as *GrapeRank* fetches the events
          that define whose perspective this is.
      - step: "5"
        text: >-
          **The interactions ingest** **—** from the *Archive Relay*, not from
          the public network. This is the step that would be unaffordable per
          request without a local archive.
      - step: "6"
        text: >-
          **Interpretation** **—** turns every interaction into a rating between
          zero and one.
        rules:
          - a follow counts 1.0
          - a mute counts 0.0
          - a report, weighted by type
          - a zap, weighted by amount
      - step: "7"
        text: >-
          **Calculation** **—** runs a weighted average iteratively until it
          converges. Four parameters shape it, and the requester sets all four.
        params:
          - name: attenuation
            note: how fast influence decays with distance
          - name: rigor
            note: how strictly confidence affects the score
          - name: minimum
            note: the score threshold for inclusion
          - name: precision
            note: how close is close enough to stop
      - step: "8"
        text: >-
          **Unsigned output returns** **—** to the Orchestrator. The service
          hands back output events without signing them, because it holds no
          key.
      - step: "9"
        text: >-
          **The Orchestrator signs and publishes** **—** to the *TrustR Relay*,
          and to any relays the request named. Feedback events go out along the
          way, so the reader sees progress rather than a spinner.
      - step: "10"
        text: >-
          **The Dashboard redraws** **—** as events land. Outputs are
          addressable, so a later recalculation replaces the same coordinates
          rather than arriving as a second answer.
    close: >-
      That signed output is now an addressable event on a public relay. NDE can
      take it as its own point of view, and it never has to integrate with
      TrustR to do so.

