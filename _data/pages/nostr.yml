# The business case, in the order a reader can receive it: what a social app is,
# what custody costs, what the protocol hands back, and who to call.

meta:
  title: Nostr 4 Social Apps
  description: >-
    The business case for Nostr: what custody costs a social app, and what the
    protocol hands back.

sections:
  - type: tiles
    glow: left
    intro: thesis
    use: protocol_cards
