# The home page carries the whole argument once: what the protocol is, what we
# build on it, what we do for you, and why the company is shaped this way.
# The Public Benefit claim belongs in the closing band, never in the proof bar.

meta: {}

sections:
  - type: hero
    glow: right
    tight: true
    cast: cast
    cast_layout: side
    head:
      title: Freedom 4 Social Apps
      lede: >-
        Nostr is the social layer where independent apps and services thrive.
        Holding custody of user accounts and data has always been the cost of
        running a social app. On Nostr, users keep control of their identity,
        content and feeds while apps reach the entire network **—** no limits,
        no fees, and no custody to carry.

    actions:
      - label: Learn About Nostr
        href: /nostr/
        style: primary
      - label: Book a Free Consult
        href: /contact/?subject=Free+consult

  - type: proof-bar
    band: sunk
    ruled: true
    flush: true
    items:
      - claim: We Collaborate on Standards
        note: for interoperability across apps and services. 
      - claim: We Run Infrastructure
        note: to support a stable network with easy onramps.
      - claim: We Offer Nostr Integration
        note: to leverage non-custody as a business model. 

  - type: tiles
    id: nostr
    intro: thesis
    use: protocol_cards
    head:
      title: Nostr 4 Social Apps
      sub: Nostr is the social layer for independent apps.
    actions_align: center
    actions:
      - label: Learn More About Nostr
        href: /nostr/
      - label: Book a Free Consult
        href: /contact/
        style: primary
        size: lg

  - type: products
    id: infrastructure
    band: sunk
    head:
      watermark: Infrastructure
      light: We build Non-Custodial Nostr Tech
      lede: >-
        Our products are specifically designed to preserve non-custody for
        social apps and services across the network.
      lede_size: xl
    items:
      - badge:
          label: Live
          tone: live
        name: TrustR
        body: >-
          TrustR is our flagship recommendation and discovery provider for
          non-custodial social apps. Under the hood, ranking
          algorithms are highly configurable and portable across providers. On the surface, platforms don't need to manage feed algorithms, they become a shared commodity that anyone can generate or consume.
        standards:
          label: 
          chips:
            - label: "TSM · standard"
              href: https://gitworkshop.dev/manime@nostr4.social/relay.ngit.dev/tsm
            - label: "NAS · standard"
              href: https://gitworkshop.dev/manime@nostr4.social/relay.ngit.dev/nas
            - label: "GrapeRank ·  library"
              href: https://github.com/graperank/tsm-graperank-library
        actions:
          - label: Read the White Paper
            href: /trustr/
          - label: Launch the Demo
            href: https://trustr.ing
            style: primary
            external: true
            note: trustr.ing
      - badge:
          label: In development
          tone: soon
        name: NostrMe
        body: >-
          NostrMe is a working title for our next business critical infra project. It will introduce Passkey to Nostr (allowing OS native key generation, identity management, and transparent event signing) with cross device support, key recovery, and custom invites for in-app onboarding. Social apps will never have to touch private keys again **—** and users might never know the difference.
        actions:
          - label: White Paper Coming Soon
            style: disabled

  - type: services-band
    id: growth
    use: services_band
    head:
      watermark: Growth
      light: We are Nostr Integration Experts.
      lede: >-
        We offer concierge services for companies at any stage, from sizing up
        the protocol to building and shipping on it.
      lede_size: xl
    actions_align: center
    actions:
      - label: Contact Us
        href: /contact/
        style: primary
        size: lg

  - type: callout
    id: benefit
    band: raised
    head:
      title: Public Benefit
      lede: >-
        Most companies write a mission statement as an afterthought. We filed
        ours in Delaware. Nostr4 is a Public Benefit Corporation, chartered to
        expand user-governed services on open protocols. The charter is not
        attached to the business model. It is the business model **—**
        notarized.
    actions:
      - label: About Nostr4
        href: /about/
        icon: caret
