  - type: callout
    id: charter
    band: raised
    head:
      title: A Public Benefit Corporation
      lede: >-
        Nostr4 is a PBC, with a "statement of public benefit" embedded in our articles of incorporation. Most of the time, these statements are just virtue signalling unrelated to profit. The Nostr4 statement of benefit is directly aligned with our business model. It simply states that growing (non-custodial) Nostr is itself a justifiable and desirable endeavor for our leadership. We believe this is true, and also that this will be profitable endeavor for our company.
    quote: >-
      The purpose of the company is … to strengthen open public discourse,
      market competition, and community resilience, as a public benefit, by
      expanding access to user-governed, interoperable services that empower
      individuals and organizations to control their digital identity,
      communications, and information flows through a distributed market of
      independent providers operating on open protocol standards.
    actions:
      - label: Contact us
        href: /contact/
        style: primary
