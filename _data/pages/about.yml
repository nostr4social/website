meta:
  title: About us
  description: >-
    We develop Nostr standards and infrastructure products, and offer custom Nostr integration services, for social tech companies to leverage non-custody as a business model.

sections:
  # The page's h1 opens this band, so the glow reaches the story and the
  # milestones, not just the title. Gold marks the company; rust marks what
  # Nostr4 built.
  - type: story
    id: story
    glow: left
    head:
      title: About us
      level: h1
    lede: >-
      We develop Nostr standards and infrastructure products, and offer custom Nostr integration services, for social tech companies to leverage non-custody as a business model. 
    blocks:
      - eyebrow: Our vision
        body: >-
          Nostr is the social layer for independent apps. The protocol is young and the network is small. Even so, it is the ideal place for a tech company to profit without holding custody of user accounts and data. What it still lacks is the technology that removes friction and drives adoption. Nostr4 builds that technology as new standards and infrastructure, aimed squarely at the growth of non-custodial apps. Every app that integrates with Nostr adds value for all the others. Our growth is tied to the network’s — by design.
      - eyebrow: Our story
        body: >-
          Work toward Nostr4 began in December 2023 with an app for inviting friends in person to Nostr. Building it showed that discovery depends on the inviter's trusted network. Nostr didn't have a Web-of-Trust library, so Manuel developed GrapeRank with David Strayhorn. That library now runs inside TrustR. Through 2025, Mani's work uncovered a larger fact: non-custody is real a value-add the Nostr can provide for social tech companies but the protocol and the netowrk are not quite ready for business. This became the thesis for a presentation series "Nostr for Social Apps". Mani then joined a Web-of-Trust hackathon to jump-start a team around TrustR, and to pitch investors. In February 2026 BlockHenge agreed to back the work, and Nostr4 was born. This seed round is focused proving our non-custody thesis, with interoperable discovery and recommendation that apps actually benefit from.
    timeline:
      eyebrow: Timeline
      label: Company timeline
      legend:
        company: company
        built: product
      items:
        - when: Mar 2024
          iso: 2024-03
          title: NostrMeet.me
          tone: rust
          note: >-
            Launched NostrMeet.me, a QR invite app that pushed us to solve
            non-custodial Webs of Trust over Nostr.
        - when: Feb 2025
          iso: 2025-02
          title: GrapeRank Library
          tone: rust
          note: >-
            Released Nostr's first open source library for Web of Trust
            providers, paving the way for non-custodial apps.
        - when: Jul 2025
          iso: 2025-07
          title: Business Conceived
          note: >-
            After many conversations and presentations, we learned both the
            difficulties and the opportunities that Nostr integration offers
            social tech companies.
        - when: Jan 2026
          iso: 2026-01
          title: Trust Service Machines
          tone: rust
          note: >-
            Published the TSM standard for announcing, requesting and providing
            Web of Trust services to non-custodial apps.
        - when: Feb 2026
          iso: 2026-02
          title: Nostr4 Incorporated
          note: >-
            Incorporated as a Delaware Public Benefit Corporation while building
            the first standards-based trust service provider for Nostr.
        - when: Apr 2026
          iso: 2026-04
          title: TrustR Demo
          tone: rust
          note: >-
            Still polished and tweaked after the hackathon, the demo shows what
            service interoperability makes possible.
        - when: Sep 2026
          iso: 2026-09
          title: Seed Funded
          note: After months of preparation, the real work begins.
        - when: ETA Jan 2027
          iso: 2027-01
          title: TrustR Product Launch
          tone: rust
          future: true
          note: >-
            While the ecosystem of interoperable social apps grows, our flagship
            product is being built to offer enterprise-ready non-custodial
            recommendation and discovery over Nostr.

