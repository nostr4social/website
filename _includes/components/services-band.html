{%- comment -%}
  items   [{title, body}]
{%- endcomment -%}
{%- assign b = include.block -%}
<div class="grid grid--3">
  {%- for item in b.items -%}
  <div class="service">
    <h3 class="service__title">{{ item.title }}</h3>
    {% include lib/text.html text=item.body class="service__body" %}
  </div>
  {%- endfor -%}
</div>
